[package]
name = "init"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The first program of stafeto"

# What init decides, apart from the calls it makes: tested on the host.
[lib]
bench = false

[[bin]]
name = "init"
test = false
bench = false

# The table init starts (init::table::TABLE): the one that ships without
# a feature; each test image builds with one of these, never two.
[features]
# The longest step of init's loop for each method, printed when it grows
# (rt feature step-stats; xtask process-steps, under -icount).
steps = ["rt/step-stats"]
# The heartbeats of all the services of the image start on one grid
# (rt feature beat-grid): the worst phase of their wait for init, which
# xtask process-steps grid measures apart from the other steps.
steps-grid = ["steps", "rt/beat-grid"]
# Deliberate breaks the host tests catch (`cargo xtask ena-breaks`).
break-bar-size = []
break-bar-offset = []
break-measure-twice = []
break-no-enable = []
break-no-start = []
break-keep-master = []
break-master-left = []
table-test = []
table-cycle = []
table-ceiling = []
vz = []
table-posix-abi-vz = []
table-busybox-dialog-vz = []
# The shell on EC2 (t4g.small): the console is the 16550 of the SPCR.
table-aws = []
table-rtbench-vz = []
table-rtbench-posix = []
table-rtbench-posix-vz = []
# The probe of a device's stop (console-restart-vz): init watches the DMA
# object of a driver that ended for 300 ms after the stop.
dma-watch = []
table-ramfs = []
table-layer-probe = []
table-posix-abi = []
table-relibc = []
table-relibc-threads = []
# The probe of POSIX processes (posix-procs) and the records it spawns.
table-posix-procs = []
table-posix-lock-ring = []
table-posix-shares = []
table-posix-native-vz = []
table-posix-files = []
data-carrier-probe = []
ramfs-cleanup = []
loader-abort = []
loader-info = ["loader-abort"]
table-loader-channels = []
table-posix-poll = []
# The C probe of sockets (xtask posix-sock).
table-posix-sock = []
# The C probe of message queues, semaphores and shared memory (xtask posix-ipc).
table-posix-ipc = []
table-posix-pty = []
# The probe of the longest step of the process service (posix-procs in the
# steps mode, xtask process-steps).
table-posix-steps = []
table-os-test = []
table-busybox = []
table-busybox-dialog = []
# The games image: the dialog with the quota of Doom (xtask doom-headless).
table-doom = []
table-base = []
table-posix-dialog = []
table-posix-dialog-vz = []
# The probe of the terminal service (xtask tty, tty-vz).
table-tty = []
table-tty-vz = []
table-tty-steps = []
# The probe of the terminal in C (xtask posix-tty, posix-tty-vz).
table-posix-tty = []
table-posix-tty-vz = []
# The probes of the entropy device's driver (xtask entropy, entropy-vz).
table-entropy = []
table-entropy-vz = []
# The image of the boot seed with no device (xtask entropy-seed).
table-entropy-seed = []
# The probe of the display service (xtask gpu-probe).
table-gpu = []
# The network service in the image of the shell, and the image of its probe
# (xtask net-probe).
table-net = []
# With table-net or table-net-probe: the network service on QEMU's machine
# with an ITS, a virtio-net-pci with a vector of MSI-X a queue (table/net.rs,
# NETD_ITS; xtask's machine ITS).
net-its = []
table-net-probe = []
# The probe's image with both network devices on QEMU.
table-net-probe-two = []
# The shell with both network devices on QEMU (xtask fast-probe: a program
# claims the second).
table-net-two = []
# The probe of F-Stack on its loopback (xtask fstack-probe).
table-fstack-probe = []
# The probe of F-Stack on the second network device (xtask fstack-probe device).
table-fstack-device = []
# nginx on the stack in a process, on QEMU and on Apple VZ (xtask fast-probe nginx, net-vz --nginx).
table-fast-nginx = []
table-fast-nginx-vz = []
# The same with the quota grant of the worker, for 100 000 connections (xtask fast-probe scale).
table-fast-scale = []
table-fast-scale-vz = []
# nginx on the stack as a consumer of the switch of the network service: one device (xtask fast-probe switch, net-vz --fast --switch).
table-fast-switch = []
table-fast-switch-vz = []
table-fast-switch-scale = []
table-fast-switch-scale-vz = []
# The probe of the big room (xtask posix-map big).
table-posix-map-big = []
# The walk of Apple VZ's bus 0 (xtask pci-walk-vz).
table-pci-walk-vz = []
# The walk of QEMU's bus 0 (xtask pci-walk).
table-pci-walk-qemu = []
# The disk service and its probe (xtask blk-probe).
table-blk-probe = []
table-store-probe = []
# The package service with a client that waits 3 s for its READY (xtask init-wait).
table-init-wait = []
# The package service and the probe of its session in fork, spawn and exec (xtask pkg-slot).
table-pkg-slot = []
# The shell with the network service on Apple VZ, one and two network devices.
table-net-vz = []
table-net-vz2 = []
# The image of the measurement of stage P7: the shell on VZ with the network
# service and the shell's processes on four CPUs (table/bench.rs).
table-bench-vz = []
# The same image with the shell's processes on CPUs 1 to 3, away from the
# network service on CPU 0 (the measurement T5 of the network service).
table-bench-pinned-vz = []
# The same image with every program on CPU 0, where the network service runs
# (the measurement of the cost of a call on another CPU).
table-bench-cpu0-vz = []
# The network service of a bench table gets a resource with KSTATS, `trace`:
# the images of the time stamps dump the rings of the kernel with it.
bench-stamps = []
# The same for the row F1: nginx on the stack on VZ, both network devices
# (table/bench.rs).
table-bench-fast-vz = []
table-bench-fast-switch-vz = []
# The image of F1s with the shell's processes on CPUs 1 to 3, away from the
# network service and the switch on CPU 0.
table-bench-fast-switch-pinned-vz = []
# The roles of the probe's client: `s` at 8, 64 or 256 places of the table
# (the measurement of the steps), or the rates of the loopback; with none the
# client runs the registry and the table filled to the sockets limit.
net-sockets-8 = []
net-sockets-64 = []
net-sockets-256 = []
net-echo = []
# The network service alone on CPU 0 (the image runs on two CPUs).
net-alone = []
net-full-batch = []
net-all-groups = []
net-wakes = []
net-idle = []
net-listen = []
net-timers = []
net-wire = []
# Role `W`: the host's datagrams of full frames through a forwarded port.
net-wire-echo = []
# Roles `C` (CLONE and CLONE_MORE of 1 000 descriptions) and `A` (ABANDON of 16
# operations).
net-clone = []
net-abandon = []
# Role `E`: epoll in the service (sets, the wait, the step of waking, the drop).
net-epoll = []
# Role `x`: passes (EXPORT, ADOPT, the last copy going) and time limits.
net-passes = []
# Roles `G` and `B`: the shared buffers (the portion of a copy and 64 sessions).
net-buffers = []
# The probe of the input service (xtask input-probe).
table-input = []
# The C probe of getentropy and getrandom (xtask posix-random).
table-posix-random = []
# The same with the entropy service ended while programs start (xtask posix-random-restart).
table-posix-random-restart = []
# The same with the network service (xtask posix-random-net).
table-posix-random-net = []
# The same with two stack instances of the network service (xtask posix-random-net-two).
table-posix-random-net2 = []
# The C probe of the display service's place in a process (xtask posix-display).
table-posix-display = []
# The C probe of the screen and the keys on libc.so (xtask display-probe).
table-display = []

[dependencies]
abi = { path = "../../lib/abi" }
bootimg = { path = "../../lib/bootimg" }
proto-fs = { path = "../../proto/fs" }
proto-init = { path = "../../proto/init" }
proto-pipe = { path = "../../proto/pipe" }
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }
virtio-pci = { path = "../../lib/virtio-pci" }
pci = { path = "../../lib/pci" }
# The text of a batch of the kernel log (uart::log), which the worker
# shows once the console's driver ended for good.
uart = { path = "../uart" }

# The program alone runs on stafeto: the host tests of the library build
# without rt.
[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }

# The tests compare the PCI numbers of the network records with the service's
# (netd::pci).
[dev-dependencies]
netd = { path = "../netd" }
pci = { path = "../../lib/pci", features = ["fake"] }
