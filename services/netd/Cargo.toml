[package]
name = "netd"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The network service of stafeto: its own virtio-net driver on virtio-mmio and the smoltcp stack, DHCP, ARP and ICMP echo"

# What the service decides, apart from the device and the calls: tested on
# the host.
[lib]
bench = false

[[bin]]
name = "netd"
test = false
bench = false

# `probe`: the methods PING and CRASH of proto_net and the counters line
# of CONFIG, for the network probe.
# `steps`: each new longest step of the loop goes to the console (rt's
# feature step-stats), for the measurement under -icount.
# `batch-N` and `send-N`: the frames of a step of receiving and of sending,
# for the measurement that chose them (the defaults are the chosen ones).
[features]
probe = []
batch-16 = []
batch-8 = []
batch-4 = []
batch-1 = []
send-16 = []
send-8 = []
send-4 = []
send-2 = []
# `limit-8`, `limit-64`, `limit-256`, `limit-1280`: the sockets limit, for the same
# measurement (the default is the chosen one).
# `split`: the breakdown of the step of the stack by parts (measurement only).
split = []
# `portion-N`: the bytes one request with a cell of the shared buffer copies
# at most, N KiB, for the measurement that chose it (the default is the chosen one).
portion-16 = []
portion-8 = []
portion-4 = []
egress-1 = []
egress-4 = []
limit-8 = []
limit-64 = []
limit-256 = []
limit-1280 = []
steps = ["rt/step-stats"]

[dependencies]
abi = { path = "../../lib/abi" }
proto-net = { path = "../../proto/net" }
proto-init = { path = "../../proto/init" }
proto-wire = { path = "../../proto/wire" }
proto-entropy = { path = "../../proto/entropy" }
virtio-mmio = { path = "../../lib/virtio-mmio" }
virtio-pci = { path = "../../lib/virtio-pci" }

# The numbers of the neighbours on VZ's bus that the BARs of `pci` go past.
[dev-dependencies]
virtio-console = { path = "../virtio-console" }
virtio-rng = { path = "../virtio-rng" }

# The program alone runs on stafeto: the host tests of the library build
# without rt, the device's crate and the stack.
[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
posix-fs = { path = "../../lib/posix-fs" }
proto-fs = { path = "../../proto/fs" }
proto-pipe = { path = "../../proto/pipe" }
proto-process = { path = "../../proto/process" }
posix-random = { path = "../../lib/posix-random" }
# `alloc` as the other drivers take it: one build of the boot image unifies
# the crate's features, and the service never allocates.
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }
# The stack: IPv4 over Ethernet with DHCP, ICMP echo, UDP and TCP (the
# sockets of the next stage, built in from the first so that the build of
# the stack without std is settled once). `auto-icmp-echo-reply` answers
# ping; without it the stack stays silent (a test of xtask reads this line).
smoltcp = { version = "0.14.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-tcp-reno",
    "socket-dhcpv4",
    "auto-icmp-echo-reply",
    "iface-neighbor-cache-count-16",
] }
