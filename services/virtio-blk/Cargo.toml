[package]
name = "virtio-blk"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The driver of the Virtio block device on QEMU's virt, a Virtio PCI function: the disk service of stafeto"

# What the driver decides, apart from the device and the calls: tested on
# the host.
[lib]
bench = false

[[bin]]
name = "virtio-blk"
test = false
bench = false

# `crash`: the method CRASH of proto_blk, for the restart probe.
# `steps`: each new longest step of the loop goes to the console (rt's
# feature step-stats), for the measurement under -icount.
[features]
crash = []
# `deaf`: the driver stops answering from the first write of a package's data (32 sectors or more)
# on: the request stays with the driver, and no TAKE is ever READY or notified (the probe of the
# package service's deadline on the disk, xtask store-probe deaf).
deaf = []
# `deaf-start`: with `deaf`, the driver stops answering at the first read, so the start of the
# package service fails on the disk (xtask store-probe no-store).
deaf-start = ["deaf"]
steps = ["rt/step-stats"]

[dependencies]
abi = { path = "../../lib/abi" }
proto-blk = { path = "../../proto/blk" }
proto-init = { path = "../../proto/init" }
proto-wire = { path = "../../proto/wire" }
virtio-mmio = { path = "../../lib/virtio-mmio" }
virtio-pci = { path = "../../lib/virtio-pci" }

# The program alone runs on stafeto: the host tests of the library build
# without rt and without the device's crate beyond virtio-mmio.
[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }
