[package]
name = "ramfs"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "Small writable RAM file service for early stafeto userspace"

[lib]
bench = false

[[bin]]
name = "ramfs"
test = false
bench = false

[features]
# Deliberate break (`cargo xtask budget-breaks`): the service takes no budget from its start data, so its request thread runs unbound.
break-budget-unbound = []
# Deliberate break (`cargo xtask layer-posix breaks`): a POSIX walk of a layered image that starts at
# a descriptor expands a link or a `..` that reaches the root itself, and the write guard is off.
break-layered-guard = []
# Deliberate break (`cargo xtask layer-posix boot breaks`): the write guard is on from the start of
# a layered service and not at GUARD, so a machine with no data volume cannot write.
break-ramfs-guard-early = []
# Read-only retained-session observation for the owner-death regression.
auth-probe = []
# A bounded receive pause for genuine queued-request signal cancellation.
signal-probe = []
# Read-only observation of the genuine Process page in the dedicated lifetime image.
lifetime-probe = []
image-gates = ["auth-probe"]
image-info-probe = ["auth-probe"]
# The longest step of the loop for each method, printed when it grows (rt
# feature step-stats; xtask process-steps, under -icount).
steps = ["rt/step-stats"]
# The calls of the service (all, the reads among them, and SNAPSHOT_FD) printed as records
# `ramfs: prof <id> calls <n> reads <n> snaps <n>` at most ten times a second while they
# change: the measurement of the calls a response of a server makes to the file service.
profile = []
# The line that closes a round of the audit tells its span, the budget time and the overruns in
# it and in the gap before it (`ramfs: audit round N steps S span_us ...`): two reads of the
# budget a round. Only the image of `posix-fifo-steps` turns it on; every other steps image
# prints the plain line.
audit-readout = []
# The diagnostic of the layer probe: the number of mappings the service holds (0xfff0).
layer-probe = []
# Full dispatch samples in the dedicated filled-lock measurement image.

[dependencies]
abi = { path = "../../lib/abi" }
bootimg = { path = "../../lib/bootimg" }
posix-perm = { path = "../../lib/posix-perm" }
proto-clock = { path = "../../proto/clock" }
proto-fs = { path = "../../proto/fs" }
proto-pipe = { path = "../../proto/pipe" }
proto-init = { path = "../../proto/init" }
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }

[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
posix-clock = { path = "../../lib/posix-clock" }

[dev-dependencies]
bootimg = { path = "../../lib/bootimg", features = ["write"] }
