[package]
name = "ramfs"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "Small writable RAM file service for early stafeto userspace"

[lib]
bench = false

[[bin]]
name = "ramfs"
test = false
bench = false

[features]
# Read-only retained-session observation for the owner-death regression.
auth-probe = []
image-gates = ["auth-probe"]
# The longest step of the loop for each method, printed when it grows (rt
# feature step-stats; xtask process-steps, under -icount).
steps = ["rt/step-stats"]

[dependencies]
abi = { path = "../../lib/abi" }
bootimg = { path = "../../lib/bootimg" }
proto-clock = { path = "../../proto/clock" }
proto-fs = { path = "../../proto/fs" }
proto-init = { path = "../../proto/init" }
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }

[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
posix-clock = { path = "../../lib/posix-clock" }

[dev-dependencies]
bootimg = { path = "../../lib/bootimg", features = ["write"] }
