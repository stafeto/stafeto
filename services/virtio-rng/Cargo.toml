[package]
name = "virtio-rng"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The driver of the Virtio entropy device: virtio-mmio on QEMU, Virtio PCI on Apple VZ"

# What the driver decides, apart from the device and the calls: tested on
# the host.
[lib]
bench = false

[[bin]]
name = "virtio-rng"
test = false
bench = false

# `crash`: the method CRASH of proto_entropy, for the restart probes.
# `steps`: each new longest step of the loop goes to the console (rt's
# feature step-stats), for the measurement under -icount.
[features]
crash = []
steps = ["rt/step-stats"]

[dependencies]
abi = { path = "../../lib/abi" }
proto-entropy = { path = "../../proto/entropy" }
proto-init = { path = "../../proto/init" }
proto-wire = { path = "../../proto/wire" }
virtio-pci = { path = "../../lib/virtio-pci" }

# The program alone runs on stafeto: the host tests of the library build
# without rt and without the device's crate (virtio-drivers, MIT).
[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
# `alloc` as the console's driver takes it: one build of the boot image
# unifies the crate's features, and the driver never allocates.
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }
