[package]
name = "datafsd"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The data file service of stafeto: the files of the volume mounted at /data, littlefs on the data partition of a disk service"

[[bin]]
name = "datafsd"
test = false
bench = false

# `steps`: each new longest step of the loop goes to the console (rt's feature step-stats), for
# the measurement under -icount.
# `crash`: the service stops for good after the sector of the volume that
# `STAFETO_DATAFS_CRASH_AT` names was written (`cargo xtask data-crash`): that write is torn at
# the sector, the line `datafs: crash point N` is printed, and nothing is written again.
[features]
steps = ["rt/step-stats"]
crash = []
# The probe of a restart of the service: an OPEN of the name `.die` at the root ends the service with the
# exit code 1 (init starts it again), so that a program can see the descriptors of the old instance
# answer EIO and the new instance take new opens.
probe-restart = []
# The stop handler exits at once (the probe of the stop handlers must catch it).
break-datafs-stop = []

[dependencies]
abi = { path = "../../lib/abi" }
datafs = { path = "../../lib/datafs" }
posix-clock = { path = "../../lib/posix-clock" }
proto-blk = { path = "../../proto/blk" }
proto-clock = { path = "../../proto/clock" }
proto-data = { path = "../../proto/data" }
proto-init = { path = "../../proto/init" }
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }
rt = { path = "../../lib/rt" }
