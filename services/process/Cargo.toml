[package]
name = "posix-process-service"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "posix-process-service"
test = false
bench = false

[features]
transport-probe = []
# The probe of POSIX processes whose service ended: the service ends before
# it registers (xtask posix-orphans).
exit-early = []

[dependencies]
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }
proto-init = { path = "../../proto/init" }
process-client = { path = "../../lib/process-client" }
rt = { path = "../../lib/rt" }
posix-credentials = { path = "../../lib/posix-credentials" }
posix-heap = { path = "../../lib/posix-heap" }
