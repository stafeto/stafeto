[package]
name = "posix-process-service"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"

# The table of records, apart from the calls the service makes: tested on
# the host.
[lib]
bench = false

[[bin]]
name = "posix-process-service"
test = false
bench = false

[features]
# The refusals of ADOPT and ADOPTED that only the service can reach: the
# adopter sends them to init first and says how they went (xtask
# posix-threads).
adoption-refusals = []
# The probe of POSIX processes whose service ended: the service ends before
# it registers (xtask posix-orphans).
exit-early = []
# The longest step of the loop for each method, printed when it grows (rt
# feature step-stats; xtask process-steps, under -icount).
steps = ["rt/step-stats"]

[dependencies]
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }
proto-init = { path = "../../proto/init" }
posix-credentials = { path = "../../lib/posix-credentials" }

# The program alone runs on stafeto: the host tests of the library build
# without rt.
[target.'cfg(target_os = "none")'.dependencies]
bootimg = { path = "../../lib/bootimg" }
proto-loader = { path = "../../proto/loader" }
rt = { path = "../../lib/rt" }
