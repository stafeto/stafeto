[package]
name = "posix-process-service"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"

# The table of records, apart from the calls the service makes: tested on
# the host.
[lib]
bench = false

[[bin]]
name = "posix-process-service"
test = false
bench = false

[features]
# The refusals of ADOPT and ADOPTED that only the service can reach: the
# adopter sends them to init first and says how they went (xtask
# posix-threads).
adoption-refusals = []
# The probe of POSIX processes whose service ended: the service ends before
# it registers (xtask posix-orphans).
exit-early = []
# The longest step of the loop for each method, printed when it grows (rt
# feature step-stats; xtask process-steps, under -icount).
steps = ["rt/step-stats"]
tty-probe = []
# Exact SetId reply corruption and readonly Image handoff diagnostics.
image-probe = []
# Only the dedicated PID-lifetime image can query the shared page.
lifetime-probe = []
# The sessions EntropyRejoin gives at most are 2 and not 192, for the probe of
# the limit (xtask posix-random-restart).
rejoin-max-2 = []
# Deliberate breakage of EntropyRejoin (xtask random-restart-breaks, and the
# host tests of services/process/src/rejoin.rs): no check of the session a
# process took in this generation, no check that it was born under an earlier
# instance, no limit on the sessions of a generation, the end of a record that
# gives its session back is not counted, a Register that leaves the count.
break-rejoin-twice = []
break-rejoin-born = []
break-rejoin-unlimited = []
break-rejoin-leak = []
break-rejoin-keep-count = []

[dependencies]
abi = { path = "../../lib/abi" }
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }
proto-init = { path = "../../proto/init" }
proto-entropy = { path = "../../proto/entropy" }
posix-credentials = { path = "../../lib/posix-credentials" }

# The program alone runs on stafeto: the host tests of the library build
# without rt.
[target.'cfg(target_os = "none")'.dependencies]
bootimg = { path = "../../lib/bootimg" }
proto-loader = { path = "../../proto/loader" }
rt = { path = "../../lib/rt" }
