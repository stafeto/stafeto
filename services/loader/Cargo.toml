[package]
name = "loader"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "The loader of POSIX programs from files: it runs in the new process, which pays for the program's image"
build = "build.rs"

[lib]
name = "loader_image"
path = "src/image_info.rs"

[[bin]]
name = "loader"
test = false
bench = false

[features]
auth-probe = []
# Deliberate breakage (cargo xtask random-breaks): AT_RANDOM is 16 bytes of zeros.
break-at-random = []
# Deliberate breakage (cargo xtask random-restart): a start whose entropy
# session died with its instance keeps it.
break-no-heal = []
# The same for a fork's copy alone.
break-no-heal-fork = []
# A start whose parent gave no session gets one from the root.
break-heal-empty = []
image-gates = ["auth-probe"]
image-info-probe = ["image-gates"]
# The probes of the copy of a fork (posix-procs): pieces of 64 KiB, so
# that the copy of a region past one piece, with an offset into the
# parent's object, runs within a record's quota of 2 MiB.
small-pieces = []
# The steps of a copy with their ticks (rt::println; xtask process-steps,
# under -icount).
steps = []
# The deepest the loader's stack went, printed at the jump (xtask process-steps
# and posix-so check it).
stack-depth = []

[dependencies]
proto-clock = { path = "../../proto/clock" }
abi = { path = "../../lib/abi" }
bootimg = { path = "../../lib/bootimg" }
dynlink = { path = "../../lib/dynlink" }
posix-random = { path = "../../lib/posix-random" }
proto-entropy = { path = "../../proto/entropy" }
proto-fs = { path = "../../proto/fs" }
proto-net = { path = "../../proto/net" }
proto-pipe = { path = "../../proto/pipe" }
proto-loader = { path = "../../proto/loader" }
proto-process = { path = "../../proto/process" }
proto-tty = { path = "../../proto/tty" }
proto-wire = { path = "../../proto/wire" }
rt = { path = "../../lib/rt" }
