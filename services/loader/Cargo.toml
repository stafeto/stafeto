[package]
name = "loader"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "The loader of POSIX programs from files: it runs in the new process, which pays for the program's image"
build = "build.rs"

[lib]
name = "loader_image"
path = "src/image_info.rs"

[[bin]]
name = "loader"
test = false
bench = false

[features]
auth-probe = []
image-gates = ["auth-probe"]
# The probes of the copy of a fork (posix-procs): pieces of 64 KiB, so
# that the copy of a region past one piece, with an offset into the
# parent's object, runs within a record's quota of 2 MiB.
small-pieces = []
# The steps of a copy with their ticks (rt::println; xtask process-steps,
# under -icount).
steps = []

[dependencies]
proto-clock = { path = "../../proto/clock" }
abi = { path = "../../lib/abi" }
bootimg = { path = "../../lib/bootimg" }
proto-fs = { path = "../../proto/fs" }
proto-loader = { path = "../../proto/loader" }
proto-process = { path = "../../proto/process" }
proto-tty = { path = "../../proto/tty" }
proto-wire = { path = "../../proto/wire" }
rt = { path = "../../lib/rt" }
