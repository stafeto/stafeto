[package]
name = "pipe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The pipe service of stafeto"

# The pipes, their descriptions and waits, apart from the loop: tested on
# the host.
[lib]
bench = false

[[bin]]
name = "pipe"
test = false
bench = false

[features]
# The longest step of the loop for each method, printed when it grows (rt
# feature step-stats; xtask process-steps, under -icount).
steps = ["rt/step-stats"]

[dependencies]
abi = { path = "../../lib/abi" }
proto-init = { path = "../../proto/init" }
proto-pipe = { path = "../../proto/pipe" }
proto-wire = { path = "../../proto/wire" }

# The program alone runs on stafeto: the host tests of the library build
# without rt.
[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
