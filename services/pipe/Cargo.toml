[package]
name = "pipe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The pipe service of stafeto"

# The pipes, their descriptions and waits, apart from the loop: tested on
# the host.
[lib]
bench = false

[[bin]]
name = "pipe"
test = false
bench = false

[features]
# Deliberate break (`cargo xtask budget-breaks`): the service takes no budget from its start data, so its request thread runs unbound.
break-budget-unbound = []
# The longest step of the loop for each method, printed when it grows (rt
# feature step-stats; xtask process-steps, under -icount).
steps = ["rt/step-stats"]
# Buffer maxima until the measurement client reads its snapshot.
quiet-steps = ["steps"]
# The thread's own time and its kernel part over each WatchStart of more than
# 16 elements, read with two calls into the kernel that lengthen the step:
# for a diagnostic run only, off in every image.
watch-readout = ["steps"]

[dependencies]
abi = { path = "../../lib/abi" }
proto-init = { path = "../../proto/init" }
proto-pipe = { path = "../../proto/pipe" }
proto-process = { path = "../../proto/process" }
posix-credentials = { path = "../../lib/posix-credentials" }
proto-wire = { path = "../../proto/wire" }

# The program alone runs on stafeto: the host tests of the library build
# without rt.
[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
