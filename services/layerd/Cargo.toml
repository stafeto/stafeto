[package]
name = "layerd"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The layer service of stafeto: the names of the layered root over the live layer on the data volume"

# What the service decides, apart from the calls: tested on the host.
[lib]
bench = false

[[bin]]
name = "layerd"
test = false
bench = false

# `steps`: each new longest step of the loop goes to the console (rt's feature step-stats), for
# the measurement under -icount.
# `break-layerd-whiteout`: the listing of the lower entries does not look at the index, so a name
# a layer of the user deleted shows again (`cargo xtask layer-names breaks`).
# `break-layerd-search`: the walk of a path does not check the right to search the directories of
# the layer of the user.
# `break-layerd-no-mark`: a name of the lower set that goes is not marked on the volume (the index
# hides it until the service starts again: `cargo xtask layer-posix write breaks`).
# `break-layerd-sticky`: the sticky bit of a directory is not looked at by a removal or a rename.
# `probe-restart`: an OPEN of a name that ends in `/.die` ends the service with the exit code 1 (init
# starts it again), for `cargo xtask layer-restart`.
# `break-layerd-one-step`: the build of the index walks the whole layer in one step of the loop, so
# the longest step grows with the layer (`cargo xtask layer-steps breaks`).
[features]
steps = ["rt/step-stats"]
probe-restart = []
# `probe-copies`: a line of the counters of the copies up (`layerd: copies queued|over: N reserved,
# ...`) whenever one moves, which `cargo xtask layer-posix copy` reads (a read open makes no copy,
# two writers of one file make one).
probe-copies = []
# `probe-cut`: with `STAFETO_LAYERD_CUT_AT=<point>` (`layerd::cut`) the service prints `layerd: cut point
# N` at that point of a copy up or of the rename of a lower name and stops there for good, for `cargo
# xtask layer-cut copy`, which kills the machine on the line and starts it again on the same disk.
probe-cut = []
# `break-layerd-epoch`: every instance carries the one epoch, so a handle of an earlier instance is
# no stranger (`cargo xtask layer-restart breaks`).
break-layerd-epoch = []
break-layerd-one-step = []
# `break-layerd-slots`: a request of a listing looks at 4,096 slots of the index, so the step is over
# 0.9 B and the step gate of `cargo xtask layer-steps breaks` alone catches it.
break-layerd-slots = []
# `break-layerd-change-one-step`: a change job does all its work in one step of the loop, so the longest
# step grows with the change and the step gate alone catches it.
break-layerd-change-one-step = []
# The deliberate breaks of the copy up (`cargo xtask layer-posix copy breaks`, `layer-steps breaks`
# and the host tests): `break-layerd-copy-counter-ino` the copy of a file and the directories of its
# path take numbers of the counter and lose the lower ones (`st_ino` changes with the copy);
# `break-layerd-copy-attrs` the worker does not give the copy the owner, mode and times of the
# lower file; `break-layerd-copy-in-loop` the loop moves the bytes of the copy in its own step (the
# step gate of `layer-steps breaks` catches it); `break-layerd-copy-elf` the worker copies a program
# too; `break-layerd-copy-recheck` the commit does not walk the name again, so a name deleted or made
# during the copy is overwritten by the copy.
break-layerd-copy-counter-ino = []
break-layerd-copy-attrs = []
break-layerd-copy-in-loop = []
break-layerd-copy-elf = []
break-layerd-copy-recheck = []
# Breaks of part B: `break-layerd-copy-rename-open` the worker makes the copy at its final name in the
# layer, so the name is there before its bytes are (`cargo xtask layer-cut copy` catches the partial
# file after a cut); `break-layerd-rename-no-mark` the rename of a lower file leaves its old name
# unmarked, so the lower name shows again (`cargo xtask layer-posix write breaks` and the host tests).
break-layerd-copy-rename-open = []
break-layerd-rename-no-mark = []
break-layerd-whiteout = []
break-layerd-search = []
break-layerd-no-mark = []
break-layerd-sticky = []

[dependencies]
abi = { path = "../../lib/abi" }
posix-perm = { path = "../../lib/posix-perm" }
proto-data = { path = "../../proto/data" }
proto-fs = { path = "../../proto/fs" }
proto-layer = { path = "../../proto/layer" }
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }

[target.'cfg(target_os = "none")'.dependencies]
proto-init = { path = "../../proto/init" }
rt = { path = "../../lib/rt" }
