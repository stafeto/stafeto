[package]
name = "busybox-probe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-2.0-only"
description = "BusyBox applets on relibc in a stafeto boot image"
build = "build.rs"

[features]
ash-probe = []
ash-interactive = ["posix-crt/uart-input"]
ls-probe = []

[[bin]]
name = "busybox-probe"
test = false
bench = false

[dependencies]
posix-crt = { path = "../../lib/posix-crt" }
rt = { path = "../../lib/rt" }
