[package]
name = "posix-random-probe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The C probe of getentropy, getrandom and the generator across fork"
build = "build.rs"

[[bin]]
name = "posix-random-probe"
test = false
bench = false

[features]
# Deliberate breakage (cargo xtask random-restart-breaks): a session that
# died with the entropy service's instance is never replaced through init.
break-no-reconnect = ["posix-abi/break-no-reconnect"]

[dependencies]
proto-entropy = { path = "../../proto/entropy" }
posix-abi = { path = "../../lib/posix-abi" }
posix-crt = { path = "../../lib/posix-crt" }
rt = { path = "../../lib/rt", features = ["count-calls"] }
