[package]
name = "posix-thread-probe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "posix-thread-probe"
test = false
bench = false

[features]
cancel-input = []
native-cancel-input = ["cancel-input"]

[dependencies]
posix-abi = { path = "../../lib/posix-abi", features = ["transport-probe"] }
posix-fs = { path = "../../lib/posix-fs" }
rt = { path = "../../lib/rt" }
