[package]
name = "posix-shared-probe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "posix-shared-probe"
test = false
bench = false

[features]
interrupt-probe = []
native-interrupt = ["interrupt-probe"]
input-probe = []
native-input = ["input-probe"]

[dependencies]
posix-abi = { path = "../../lib/posix-abi", features = ["transport-probe"] }
posix-fs = { path = "../../lib/posix-fs" }
rt = { path = "../../lib/rt" }
posix-request = { path = "../../lib/posix-request" }
proto-wire = { path = "../../proto/wire" }
