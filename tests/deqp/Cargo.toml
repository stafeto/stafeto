[package]
name = "deqp-egl"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"
description = "The dEQP-EGL module of VK-GL-CTS on stafeto: the test framework (tools/build-deqp.py, cargo xtask deqp) with the platform of tests/deqp/platform, linked with Mesa's EGL and softpipe"
build = "build.rs"

[[bin]]
name = "deqp-egl"
test = false
bench = false

[dependencies]
posix-crt = { path = "../../lib/posix-crt", features = ["window"] }
