[package]
name = "posix-procs"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The probe of POSIX processes in C on relibc: posix_spawn through the process service"
build = "build.rs"

[[bin]]
name = "posix-procs"
test = false
bench = false

[features]
lock-full-dup = ["lock-full-fixture", "posix-abi/close-probe"]
lock-full-dup-pid = ["lock-full-dup"]
lock-full-dup-ofd-last = ["lock-full-dup"]
lock-full-dup-ofd-alias = ["lock-full-dup"]
lock-full-ofd = ["lock-full-fixture", "posix-abi/thread-probe", "posix-abi/close-probe"]
lock-full-close = ["lock-full-wake"]
lock-full-wake = ["lock-full-capacity"]
lock-full-death = ["lock-full-capacity"]
lock-full-capacity = ["lock-full-ring"]
lock-full-ring = ["lock-full-fixture", "posix-abi/wait-probe"]
lock-full-fixture = ["dep:posix-abi", "dep:proto-fs", "dep:proto-wire", "dep:rt", "dep:posix-fs"]
lifetime-probe = ["pending-open", "dep:proto-process", "posix-abi/close-probe", "posix-abi/lock-probe", "posix-abi/wait-probe"]
jobs = []
native-scopes-launcher = []
auth-probe = ["files"]
data-carrier-probe = ["files"]
files = ["pending-open", "stages"]
stages = ["pending-open"]
change-steps = ["stages", "posix-abi/change-probe"]
names-probe = ["stages", "posix-abi/change-probe"]
names-loss = ["stages", "posix-abi/change-probe"]
pending-open = ["dep:posix-abi", "dep:proto-fs", "dep:proto-wire", "dep:rt", "dep:posix-fs", "dep:posix-sync", "dep:entries"]
loader-abort = ["files", "dep:proto-process", "dep:proto-loader", "dep:posix-fs"]
image-gates = ["loader-abort"]
image-info-probe = ["loader-abort"]
image-gates-normal = ["image-gates"]
terminal = ["posix-crt/uart-input"]

[dependencies]
posix-crt = { path = "../../lib/posix-crt" }

posix-abi = { path = "../../lib/posix-abi", optional = true }
proto-fs = { path = "../../proto/fs", optional = true }
proto-wire = { path = "../../proto/wire", optional = true }
rt = { path = "../../lib/rt", optional = true }
proto-process = { path = "../../proto/process", optional = true }
proto-loader = { path = "../../proto/loader", optional = true }
posix-fs = { path = "../../lib/posix-fs", optional = true }

posix-sync = { path = "../../lib/posix-sync", optional = true }
entries = { path = "../../lib/entries", optional = true }
