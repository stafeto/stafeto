[package]
name = "posix-procs"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The probe of POSIX processes in C on relibc: posix_spawn through the process service"
build = "build.rs"

[[bin]]
name = "posix-procs"
test = false
bench = false

[features]
jobs = []
auth-probe = ["files"]
data-carrier-probe = ["files"]
public-data-probe = ["files"]
public-data-loss-probe = ["data-carrier-probe", "public-data-probe", "posix-abi/data-driver-probe"]
open-finalize-clock-probe = ["data-carrier-probe", "posix-abi/open-finalize-clock-probe", "dep:posix-clock", "dep:posix-time", "dep:proto-clock"]
ipc-loss = ["files"]
files = ["pending-open"]
pending-open = ["dep:posix-abi", "dep:proto-fs", "dep:proto-wire", "dep:rt", "dep:posix-fs", "dep:posix-sync"]
loader-abort = ["files", "dep:proto-process", "dep:proto-loader", "dep:posix-fs"]
image-gates = ["loader-abort"]
image-info-probe = ["loader-abort"]
image-gates-normal = ["image-gates"]
t6-runtime = ["image-gates"]
terminal = ["posix-crt/uart-input"]

[dependencies]
posix-crt = { path = "../../lib/posix-crt" }

posix-abi = { path = "../../lib/posix-abi", optional = true }
proto-fs = { path = "../../proto/fs", optional = true }
proto-wire = { path = "../../proto/wire", optional = true }
rt = { path = "../../lib/rt", optional = true }
proto-process = { path = "../../proto/process", optional = true }
proto-loader = { path = "../../proto/loader", optional = true }
posix-fs = { path = "../../lib/posix-fs", optional = true }

posix-sync = { path = "../../lib/posix-sync", optional = true }

posix-clock = { path = "../../lib/posix-clock", optional = true }
posix-time = { path = "../../lib/posix-time", optional = true }
proto-clock = { path = "../../proto/clock", optional = true }
