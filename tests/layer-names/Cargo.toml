[package]
name = "layer-names"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The probe of the names of the layered root: a POSIX program of the superuser that speaks to the layer service directly (TakeRoot, SESSION, the names) and to the data file service for the pass of a file"

[[bin]]
name = "layer-names"
test = false
bench = false

[dependencies]
libc-ffi = { path = "../libc-ffi" }
posix-abi = { path = "../../lib/posix-abi" }
posix-crt = { path = "../../lib/posix-crt" }
proto-data = { path = "../../proto/data" }
proto-fs = { path = "../../proto/fs" }
proto-layer = { path = "../../proto/layer" }
proto-process = { path = "../../proto/process" }
proto-wire = { path = "../../proto/wire" }
rt = { path = "../../lib/rt" }
