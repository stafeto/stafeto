[package]
name = "focus-probe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "Guest probe of focus and composition of two clients"

[[bin]]
name = "focus-probe"
test = false
bench = false

[dependencies]
abi = { path = "../../lib/abi" }
proto-comp = { path = "../../proto/comp" }
proto-gpu = { path = "../../proto/gpu" }
proto-init = { path = "../../proto/init" }
proto-wire = { path = "../../proto/wire" }
rt = { path = "../../lib/rt" }

# `quick`: no pause after a frame for the host to photograph it.
[features]
quick = []
