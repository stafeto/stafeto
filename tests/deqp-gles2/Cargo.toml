[package]
name = "deqp-gles2"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"
description = "The dEQP-GLES2 module of VK-GL-CTS on stafeto (OpenGL ES 2.0 on Mesa's softpipe): the test framework of tests/deqp with the platform of tests/deqp/platform"
