[package]
name = "ash-launcher"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The program init starts for the shell image: it spawns the getty from BusyBox's file and waits"
build = "build.rs"

# Standard input and output through the terminal service, as the BusyBox of
# the dialog (posix-crt/uart-input).
[features]
interactive = ["posix-crt/uart-input"]

[[bin]]
name = "ash-launcher"
test = false
bench = false

[dependencies]
posix-crt = { path = "../../lib/posix-crt" }
rt = { path = "../../lib/rt" }
