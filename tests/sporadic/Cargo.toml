[package]
name = "sporadic-probe"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "SCHED_SPORADIC through relibc and the Rust POSIX layer"
build = "build.rs"

[[bin]]
name = "sporadic-probe"
test = false
bench = false

[dependencies]
posix-abi = { path = "../../lib/posix-abi", features = ["thread-probe"] }
posix-crt = { path = "../../lib/posix-crt" }
rt = { path = "../../lib/rt" }
