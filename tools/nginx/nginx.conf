# The settings of nginx in the images with the network service
# (tools/build-nginx.py, packages/nginx.toml): a master and four workers
# under nobody, each worker with its own listening socket of the
# SO_REUSEPORT group, static files from /www. The probe's variants are
# made from this file (xtask/src/nginx_probe.rs).
user nobody nobody;
worker_processes 4;
daemon off;
master_process on;
error_log stderr notice;
pid /var/run/nginx.pid;
events { use epoll; worker_connections 512; accept_mutex off; multi_accept off; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    output_buffers 2 32k;
    open_file_cache max=1000 inactive=60s;
    server {
        listen 80 reuseport;
        server_name _;
        root /www;
        location / { }
    }
}
