# The server of TLS and HTTP/2 of nginx (tools/build-nginx.py builds the
# modules), included from nginx's settings in the images that carry a key
# and a certificate: the images of `cargo xtask nginx-probe`, whose key and
# certificate come from the probe CA of xtask (xtask/src/probe_ca.rs). The
# package's nginx.conf leaves it out: nginx does not start without the
# certificate it names.
#
# TLS 1.3 alone. The suites are OpenSSL's defaults for TLS 1.3
# (TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256,
# TLS_AES_128_GCM_SHA256), all with forward secrecy and an AEAD cipher;
# `ssl_ciphers` sets the list of TLS 1.2 and below and has nothing to choose
# here. Settings that add TLSv1.2 to `ssl_protocols` get OpenSSL's DEFAULT
# list at security level 2, which still has the exchange of keys by RSA and
# the CBC mode: name `ssl_ciphers` with them.
#
# The session cache lives in memory the master maps shared before it forks
# the workers. The master reads the key as root while it reads the
# settings; the workers, under nobody, never open it.
server {
    listen 443 ssl reuseport;
    http2 on;
    server_name nginx.stafeto.test;
    root /www;
    ssl_certificate /etc/nginx/server.crt;
    ssl_certificate_key /etc/nginx/server.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_buffer_size 16k;
    location / { }
}
