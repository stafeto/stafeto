# The settings of nginx on the TCP/IP stack in its own process
# (packages/nginx-fast.toml, ports/f-stack): one worker under root, since the
# worker owns the second network device and the layer refuses the claim to
# any other user. The worker's listening socket is the stack's own, so there
# is no reuseport group and no second worker to share it with. The address
# of a listener is the second device's (0.0.0.0 means it). The probe's
# variants are made from this file (xtask/src/fast_nginx.rs).
user root;
worker_processes 1;
daemon off;
master_process on;
error_log stderr notice;
pid /var/run/nginx-fast.pid;
# A worker that is told to quit waits this long for its connections.
worker_shutdown_timeout 5s;
events { use epoll; worker_connections 1024; accept_mutex off; multi_accept off; }
http {
    types { text/html html htm; text/plain txt; application/octet-stream bin; }
    default_type application/octet-stream;
    access_log off;
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    output_buffers 2 32k;
    open_file_cache max=1000 inactive=60s;
    server {
        listen 80;
        server_name _;
        root /www;
        location / { }
    }
}
