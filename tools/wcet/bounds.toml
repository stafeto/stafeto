[[free]]
prefix = "kernel::ktest::"
why = "the kernel tests' own code: test points hand control to it in the test builds, and the kernel that ships has none of it"

[atomic]
bound = 1
why = "a retry of a store-exclusive or a wait for the turn of a ticket lock: one pass on the CPU the measurement runs on; every further pass is another CPU's hold, which B_N adds as (N - 1) * OBJ_HOLD_MAX (docs/smp.md)"

[[free]]
prefix = "kernel::sched::resume"
why = "the way out of the kernel: it ends a kernel entry after the interval a call is measured over, and a call that ends its thread never returns to dispatch to end the interval"

[[free]]
prefix = "kernel::sched::exit_loop"
why = "the loop of the way out of the kernel that resume jumps to (a jump to the address of a function)"

# Functions that begin a stretch of their own. The count of the takes of OBJ
# (k_static) leaves them out of their callers, and a [[path]] of theirs counts
# them.

[[stretch]]
function = "kernel::syscall::mem::portions"
why = "the portions of mem_map, mem_unmap and mem_protect: the first entry calls it after the poll for an interrupt that follows its checks (syscall::mem::begin), and go_on after the entry that starts over"

[[stretch]]
function = "kernel::syscall::mem::make"
why = "the portions of mem_create: the first entry calls it after the poll for an interrupt that follows its checks (syscall::mem::mem_create), and go_on after the entry that starts over"

[[stretch]]
function = "kernel::syscall::proc::process_create_second"
why = "the second portion of process_create: the first entry calls it after the poll for an interrupt that follows its first section (syscall::proc::process_create), and go_on after the entry that starts over"

# Bounds of loops. `at` is the offset of the loop's header block from the start of
# its function, or `*` for every loop of the function. A bound is the most times the
# header runs for one entry into the loop.

[[loop]]
function = "<kcore::handles::HandleTable<kernel::object::Object>>::grow::<kernel::object::Chunks>"
at = "*"
bound = 64
why = "sets the CHUNK = 64 entries of a new chunk (kcore::handles::CHUNK)"

