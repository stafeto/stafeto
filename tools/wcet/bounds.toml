# Paths that no system call starts, each with the rows of the kernel tests that
# measure it.
[[path]]
name = "timer expiry in the interrupt"
symbol = "kernel::timer::expire"
measured = ["timer portions ticks: interrupt"]
complete = "yes"

[[path]]
name = "firing of a level's timers"
symbol = "kernel::timer::fire_at"
measured = ["timer portions ticks: fire"]
complete = "yes"

# The estimate covers `irq::deliver` and one turn that frees retired objects
# (`qsbr::reclaim`, worst batch of 8). It leaves out the rest of the path the
# measure covers: `decide`, the acknowledge, `thread::run` and the entry and
# exit of the exception, which sit in `sched::exit_loop` and so in the [[free]]
# above. It is above the measure because the worst batch of `reclaim` costs far
# more than the small one of the test, and "ok" says no more than that. A full
# model of the path is a task of its own.
[[path]]
name = "interrupt of a device, to its driver"
symbol = "kernel::irq::deliver"
plus = ["kernel::qsbr::reclaim"]
measured = ["interrupt path ticks: driver", "interrupt path ticks: portion"]
complete = "yes"

[[path]]
name = "portion of cleanup"
symbol = "kernel::cleanup::portion"
measured = ["teardown portions ticks: buffers", "teardown portions ticks: shell", "teardown portions ticks: end_call", "teardown portions ticks: teardown_threads", "teardown portions ticks: child_threads", "teardown portions ticks: session_buffers", "teardown portions ticks: session_handles", "teardown portions ticks: teardown_any"]
complete = "yes"

[[path]]
name = "commands from other CPUs (SGI)"
symbol = "kernel::smp::handle"
measured = []

[[path]]
name = "portion of mem_map, mem_unmap, mem_protect"
symbol = "kernel::syscall::mem::portions"
measured = []
complete = "yes"

[[path]]
name = "portion of mem_create"
symbol = "kernel::syscall::mem::make"
measured = []
complete = "yes"

[[path]]
name = "second portion of process_create"
symbol = "kernel::syscall::proc::process_create_second"
measured = []
complete = "yes"

