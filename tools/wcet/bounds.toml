[[call]]
name = "IrqBind"
handlers = ["kernel::syscall::devices::irq_bind"]

[[call]]
name = "IrqAck"
handlers = ["kernel::syscall::devices::irq_ack"]

[[call]]
name = "ClockNow"
handlers = ["kernel::syscall::time::clock_now"]

[[call]]
name = "TimerCreate"
handlers = ["kernel::syscall::time::timer_create"]

[[call]]
name = "TimerSet"
handlers = ["kernel::syscall::time::timer_set"]

[[call]]
name = "TimerCancel"
handlers = ["kernel::syscall::time::timer_cancel"]

[[call]]
name = "ObjectInfo"
handlers = ["kernel::syscall::info::object_info"]

[[call]]
name = "DebugWrite"
handlers = ["kernel::syscall::info::debug_write"]

[[call]]
name = "ProcessControl"
handlers = ["kernel::syscall::process_control_waited"]

[[free]]
prefix = "kernel::ktest::"
why = "the kernel tests' own code: test points hand control to it in the test builds, and the kernel that ships has none of it"

[atomic]
bound = 1
why = "a retry of a store-exclusive or a wait for the turn of a ticket lock: one pass on the CPU the measurement runs on; every further pass is another CPU's hold, which B_N adds as (N - 1) * OBJ_HOLD_MAX (docs/smp.md)"
