[calibration]
counter_read = 0

[dispatch]
function = "kernel::syscall::dispatch"
restart = "kernel::syscall::mem::go_on"

[[call]]
name = "HandleClose"
handlers = ["kernel::syscall::handles::handle_close"]

[[call]]
name = "HandleDuplicate"
handlers = ["kernel::syscall::handles::handle_duplicate"]

[[call]]
name = "CreateChannel"
handlers = ["kernel::syscall::messages::channel_create"]

[[call]]
name = "Send"
handlers = ["kernel::syscall::messages::send"]

[[call]]
name = "Receive"
handlers = ["kernel::syscall::messages::receive"]

[[call]]
name = "Reply"
handlers = ["kernel::syscall::messages::reply"]

[[call]]
name = "Notify"
handlers = ["kernel::syscall::messages::notify"]

[[call]]
name = "MemCreate"
handlers = ["kernel::syscall::mem::mem_create"]

[[call]]
name = "MemMap"
handlers = ["kernel::syscall::mem::change_map"]

[[call]]
name = "MemUnmap"
handlers = ["kernel::syscall::mem::change", "kernel::syscall::mem::mem_unmap"]

[[call]]
name = "MemProtect"
handlers = ["kernel::syscall::mem::change", "kernel::syscall::mem::mem_protect"]

[[call]]
name = "ProcessCreate"
handlers = ["kernel::syscall::proc::process_create"]

[[call]]
name = "ProcessKill"
handlers = ["kernel::syscall::proc::process_kill"]

[[call]]
name = "ProcessExit"
handlers = ["kernel::syscall::proc::process_exit"]

[[call]]
name = "ThreadCreate"
handlers = ["kernel::syscall::proc::thread_create"]

[[call]]
name = "ThreadStart"
handlers = ["kernel::syscall::proc::thread_start"]

[[call]]
name = "ThreadExit"
handlers = ["kernel::syscall::proc::thread_exit"]

[[call]]
name = "ThreadSetPriority"
handlers = ["kernel::syscall::proc::thread_set_priority"]

[[call]]
name = "ThreadInterrupt"
handlers = ["kernel::syscall::proc::thread_interrupt"]

[[call]]
name = "ThreadUpcallBind"
handlers = ["kernel::syscall::upcall::thread_upcall_bind"]

[[call]]
name = "ThreadUpcallControl"
handlers = ["kernel::syscall::upcall::thread_upcall_control"]

[[call]]
name = "ThreadUpcallRequest"
handlers = ["kernel::syscall::upcall::thread_upcall_request"]

[[call]]
name = "ThreadUpcallReturn"
handlers = ["kernel::syscall::upcall::thread_upcall_return"]

[[call]]
name = "Yield"
