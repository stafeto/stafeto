#
# The packages of the Linux guest of the measurement of the network
# (tools/build-linux-guest.py), pinned by SHA-256. The build takes exactly
# these files and resolves no dependency: the list is the closure of nginx,
# the openssl program (the digests of the check), BusyBox, iperf3 and the
# kernel's modules for virtio-net, found in the
# APKINDEX of the branch on 2026-11-05. When Alpine drops a build from the
# branch the build stops and says which package left; update the pins here
# and record them in the report of the measurement.

mirror = "https://dl-cdn.alpinelinux.org/alpine"
branch = "v3.24"
repository = "main"
arch = "aarch64"

