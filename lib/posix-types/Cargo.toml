[package]
name = "posix-types"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "C ABI types and metadata conversion for stafeto Rust POSIX"

[dependencies]
proto-fs = { path = "../../proto/fs" }

[features]
# Deliberate breakage (`cargo xtask sporadic-breaks`): the layer does not
# check that `sched_ss_low_priority` is below `sched_priority`.
break-ss-ignore-low = []
