[package]
name = "posix-crt"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "Startup and static library for Rust POSIX C programs"

[lib]
crate-type = ["rlib", "staticlib"]
test = false
bench = false

# Standard input and output through the terminal service `tty` when
# init's table gives the program a session with it (5f), through the
# console's driver, the service `uart`, otherwise
# (rt::fs::Files::connect_with_uart); the RAM files beside them.
[features]
uart-input = []
# /proc in the layer, for the shell image of the utilities.
procfs = ["posix-abi/procfs", "posix-platform/procfs"]
# Part of libc.so, the C library that dynamically linked programs share:
# `stafeto_start(area, main)` replaces the program's `main` symbol and
# `__ehdr_start`; the loader writes the auxiliary vector (spec 2, 3.12.3).
shared = []
# The points of the packet path for the C glue of a stack (`stafeto_trace_*`).
trace = ["posix-abi/trace"]

[dependencies]
entries = { path = "../entries" }
proto-init = { path = "../../proto/init" }
proto-loader = { path = "../../proto/loader" }
posix-abi = { path = "../posix-abi" }
posix-fs = { path = "../posix-fs" }
posix-platform = { path = "../posix-platform" }
posix-thread = { path = "../posix-thread" }
rt = { path = "../rt" }
