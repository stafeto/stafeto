[package]
name = "posix-crt"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "Startup and static library for Rust POSIX C programs"

[lib]
crate-type = ["rlib", "staticlib"]
test = false
bench = false

# Standard input and output through the terminal service `tty` when
# init's table gives the program a session with it (5f), through the
# console's driver, the service `uart`, otherwise
# (rt::fs::Files::connect_with_uart); the RAM files beside them.
[features]
uart-input = []
# /proc in the layer, for the shell image of the utilities.
procfs = ["posix-abi/procfs", "posix-platform/procfs"]
# The data file service at /data in the layer (libc.so has it).
data = ["posix-abi/data", "posix-platform/data"]
# The layer service at the root in the layer (the layered root of an image whose init table has
# layerd). It brings the data file service with it, whose passes and redirects it uses.
layer = ["data", "posix-abi/layer", "posix-platform/layer"]
# Part of libc.so, the C library that dynamically linked programs share:
# `stafeto_start(area, main)` replaces the program's `main` symbol and
# `__ehdr_start`; the loader writes the auxiliary vector (spec 2, 3.12.3).
shared = []
# The points of the packet path for the C glue of a stack (`stafeto_trace_*`).
trace = ["posix-abi/trace"]
# The C functions of the windows of the composition service
# (`<stafeto/window.h>`, window_c.rs) in a statically linked program. libc.so
# is built without it.
window = ["posix-abi/window", "dep:comp-client"]
# The C functions of OpenWF Display (`<WF/wfd.h>`, wfd_c.rs) in a statically
# linked program. libc.so is built without it.
wfd = ["posix-abi/wfd", "dep:wfd"]
# The C functions of OpenWF Composition (`<WF/wfc.h>`, wfc_c.rs) in a
# statically linked program. libc.so is built without it.
wfc = ["posix-abi/wfc", "dep:wfc"]

[dependencies]
entries = { path = "../entries" }
proto-init = { path = "../../proto/init" }
proto-loader = { path = "../../proto/loader" }
posix-abi = { path = "../posix-abi" }
posix-fs = { path = "../posix-fs" }
posix-platform = { path = "../posix-platform" }
posix-thread = { path = "../posix-thread" }
rt = { path = "../rt" }
comp-client = { path = "../comp-client", optional = true }
wfd = { path = "../wfd", optional = true }
wfc = { path = "../wfc", optional = true }
