[package]
name = "posix-crt"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "Startup and static library for Rust POSIX C programs"

[lib]
crate-type = ["rlib", "staticlib"]
test = false
bench = false

# Standard input and output through the console's driver, the service
# `uart` (rt::fs::Files::connect_with_uart), besides the RAM files.
[features]
uart-input = []
# The program is C on relibc (5a′): relibc starts it and gives the C
# names; the layer serves relibc's stafeto platform (posix-platform).
relibc = ["dep:posix-platform", "posix-abi/libc-backend"]

[dependencies]
proto-init = { path = "../../proto/init" }
posix-abi = { path = "../posix-abi" }
posix-fs = { path = "../posix-fs" }
posix-platform = { path = "../posix-platform", optional = true }
posix-thread = { path = "../posix-thread" }
rt = { path = "../rt" }
