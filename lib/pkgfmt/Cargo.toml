[package]
name = "pkgfmt"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"
description = "The stafeto package file (.stpkg), its signatures, certificates, repository index and revocation list: read in no_std, written on the host"

[lib]
bench = false

[dependencies]
bootimg = { path = "../bootimg" }
# Pinned: the strict checks of verification live in this crate (a test in sig.rs).
ed25519-compact = { version = "=2.6.0", default-features = false }
sha2 = { version = "0.11", default-features = false }

[features]
# The writers and the checks that hash whole packages, for xtask on the host.
write = ["bootimg/write"]

[dev-dependencies]
bootimg = { path = "../bootimg", features = ["write"] }
