[package]
name = "comp-client"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"
description = "The client side of the composition service's windows of the second revision, as pure logic: the layouts of <stafeto/window.h>, the account of buffers, the merging of rectangles, the translation of refusals to errno"

[lib]
bench = false

[dependencies]
abi = { path = "../abi" }
proto-comp = { path = "../../proto/comp" }
proto-gpu = { path = "../../proto/gpu" }
proto-wire = { path = "../../proto/wire" }
