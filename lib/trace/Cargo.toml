[package]
name = "trace"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "Time stamps along the packet path: a fixed ring of (ticks, point, key) records per component, for the measurement of where the time of a request goes"

[lib]
bench = false

# `on`: the ring is real. Without it every function is empty and costs no
# instruction at its call sites (the normal and ci images).
[features]
on = []
# `bss`: the ring is in `.bss` (the network service); without it a process gives the ring its
# memory with `install`.
bss = ["on"]
