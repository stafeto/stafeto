[package]
name = "datafs"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "littlefs over a block device as a library: the volume, files and directories as slots, the minimal GPT of the data volume, tested on the host with a cut of the power at every write"
build = "build.rs"

# No call of the kernel: tested on the host against a device in memory that loses power at a chosen write.
[lib]
bench = false

[features]
# The device in memory with the cut of the power (`datafs::mem`), for the tests of a service.
model = []
# The deliberate breaks of the host tests (`cargo xtask datafs-breaks`): each does one wrong thing a
# test catches. `break-datafs-sync`: the flush of the volume does nothing, so a cut loses what was
# synced. `break-datafs-consistent`: a mount leaves a half-done rename as it is. `break-datafs-busy`:
# an open file may be removed. `break-datafs-gpt-order`: a new table is written start first.
# `break-datafs-relocate-order`: the moved backup is announced by the primary header before it is there.
# `break-datafs-ctz-hints`: a write or a truncation of a file leaves its wayposts for the blocks of a read.
# `break-datafs-trust-prog`: a program that is not read back marks its block as held by the read cache without
# copying the bytes in.
break-datafs-sync = []
break-datafs-consistent = []
break-datafs-busy = []
break-datafs-gpt-order = []
break-datafs-relocate-order = []
break-datafs-ctz-hints = []
break-datafs-trust-prog = []
# `break-datafs-tail-whole`: the copy of the tail of a rewrite never begins in steps, so the job that flushes the
# node copies it whole (as before issue #626).
break-datafs-tail-whole = []
# `break-datafs-layers-visible`: the directory `/.layers` of the layered root is visible to every session.
break-datafs-layers-visible = []
# The deliberate breaks of the leases (tests_lease.rs): `break-datafs-lease-hold` no lease holds a
# job back; `break-datafs-lease-place` a part of the holder keeps its own place in the queue;
# `break-datafs-lease-reader` a new read lease does not wait behind a writer that waits;
# `break-datafs-lease-renew` a part does not renew its lease; `break-datafs-lease-deref` a lease that
# ends does not give back its reference of the description.
break-datafs-lease-hold = []
break-datafs-lease-place = []
break-datafs-lease-reader = []
break-datafs-lease-renew = []
break-datafs-lease-deref = []
# `break-datafs-append-end`: a call on an `O_APPEND` description takes no lease, so each of its parts
# takes the end of the file on its own and the parts of two calls mix.
break-datafs-append-end = []

[dependencies]
littlefs = { path = "../../third-party/littlefs" }
proto-data = { path = "../../proto/data" }
proto-wire = { path = "../../proto/wire" }
proto-process = { path = "../../proto/process" }
abi = { path = "../abi" }
posix-perm = { path = "../posix-perm" }

[build-dependencies]
cc = "1"
