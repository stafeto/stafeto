[package]
name = "rt"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"
description = "The runtime of stafeto programs: entry point, system calls, output, time, the start protocol and the program loader"

# Programs only: the crate has its own panic handler and entry point, so no
# test harness is built for it on the host.
[lib]
test = false
bench = false

# One count of each kernel call the process makes (sys::calls), for the
# images of measurements and tests only (rtbench 2).
[features]
# Host harnesses use std; bare-metal programs always retain their panic handler.
host-tests = []
count-calls = []
# The longest step of a service's loop for each method, which a service
# that asks (`service::report_steps`) prints when it grows; off in every
# image but the process service's measurement (xtask process-steps).
step-stats = []
# The heartbeat of a service writes its t0, the deadline of its timer and the
# number of its arms into three words a test child gave (`service::PROBE`).
armed-probe = []
# The heartbeats of the services start on a grid: t0 is the start of the
# period the service registered in, so that every service with the same
# period sends its HEARTBEAT at the same instants (the worst phase of the
# wait for init, xtask process-steps). Off in every other image.
beat-grid = []

[dependencies]
abi = { path = "../abi" }
entries = { path = "../entries" }
bootimg = { path = "../bootimg" }
proto-pipe = { path = "../../proto/pipe" }
proto-fs = { path = "../../proto/fs" }
proto-init = { path = "../../proto/init" }
proto-uart = { path = "../../proto/uart" }
proto-wire = { path = "../../proto/wire" }
