[package]
name = "posix-platform"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The functions stafeto_* that relibc's stafeto platform calls in the Rust POSIX layer"

[lib]
test = false
bench = false

[dependencies]
posix-abi = { path = "../posix-abi", features = ["libc-backend"] }
posix-thread = { path = "../posix-thread" }
posix-types = { path = "../posix-types" }
