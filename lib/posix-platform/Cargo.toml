[package]
name = "posix-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "The functions stafeto_* that relibc's stafeto platform calls in the Rust POSIX layer"

[lib]
test = false
bench = false

[dependencies]
posix-abi = { path = "../posix-abi" }
posix-change = { path = "../posix-change" }
posix-thread = { path = "../posix-thread" }
posix-types = { path = "../posix-types" }
posix-signals = { path = "../posix-signals" }
posix-sync = { path = "../posix-sync" }
rt = { path = "../rt" }
posix-fs = { path = "../posix-fs" }
posix-request = { path = "../posix-request" }
proto-fs = { path = "../../proto/fs" }
proto-process = { path = "../../proto/process" }
proto-tty = { path = "../../proto/tty" }

[features]
procfs = ["posix-abi/procfs"]
# The probes of shared mappings pause the maker of an object
# (`stafeto_probe_fill_pause`).
map-probe = []
