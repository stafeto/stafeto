[package]
name = "virtio-net"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "A driver of the Virtio network device as a library: frames and their sums, the books and rings of the queues, the DMA over a driver's objects, the virtio-mmio and Virtio PCI transports"

# No call of the kernel and no stack: tested on the host.
[lib]
bench = false

[dependencies]
# The checks and the start of a transport, without the calls of rt.
virtio-mmio = { path = "../virtio-mmio", default-features = false }
virtio-drivers = { version = "0.13", default-features = false }
# The layout of the bypass ring of the second device's owner (`ffi`).
proto-net = { path = "../../proto/net" }

# `ffi`: the functions of `include/vnet.h` for a C program that owns the
# second device (spec 6, 3.9), built as `libvirtio_net.a` by
# `tools/build-libc-so.py vnet` (`cargo rustc --crate-type staticlib`), with
# a panic that calls the C library's `abort`.
[features]
ffi = []
