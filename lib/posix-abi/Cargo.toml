[package]
name = "posix-abi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
description = "Initial C ABI and startup for the Rust stafeto POSIX layer"

[lib]
test = false
bench = false

[features]
# threads::set_level, the levels of rtbench 2's threads (tests/rtbench-posix).
rtbench = []
# What the thread probes look at and steer from outside the layer: a
# thread's native handle and block, the waits it stands in, the levels of
# the file and heap workers, a cancellation window and a borrow of the
# file state (tests/posix-threads, tests/posix-shared).
thread-probe = []

[dependencies]
posix-types = { path = "../posix-types" }
posix-fs = { path = "../posix-fs" }
rt = { path = "../rt" }
posix-heap = { path = "../posix-heap" }
posix-map = { path = "../posix-map" }
posix-order = { path = "../posix-order" }
posix-request = { path = "../posix-request" }
proto-wire = { path = "../../proto/wire" }
proto-uart = { path = "../../proto/uart" }
posix-clock = { path = "../posix-clock" }
posix-sync = { path = "../posix-sync" }
posix-thread = { path = "../posix-thread" }
posix-time = { path = "../posix-time" }
proto-clock = { path = "../../proto/clock" }
posix-signals = { path = "../posix-signals" }
process-client = { path = "../process-client" }
proto-process = { path = "../../proto/process" }
proto-fs = { path = "../../proto/fs" }
proto-loader = { path = "../../proto/loader" }
proto-pipe = { path = "../../proto/pipe" }
posix-random = { path = "../posix-random" }
proto-entropy = { path = "../../proto/entropy" }
