[package]
name = "posix-abi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "Initial C ABI and startup for the Rust stafeto POSIX layer"

[lib]
test = false
bench = false

[features]
# Probe of a standard libc (relibc) above this layer: the libc owns the C
# names, so this layer exports none of its own.
libc-backend = []
transport-probe = ["posix-clock/transport-probe", "process-client/transport-probe"]

[dependencies]
posix-types = { path = "../posix-types" }
posix-fs = { path = "../posix-fs" }
rt = { path = "../rt" }
posix-heap = { path = "../posix-heap" }
posix-order = { path = "../posix-order" }
posix-request = { path = "../posix-request" }
proto-wire = { path = "../../proto/wire" }
posix-clock = { path = "../posix-clock" }
posix-time = { path = "../posix-time" }
proto-clock = { path = "../../proto/clock" }
posix-signals = { path = "../posix-signals" }
process-client = { path = "../process-client" }
proto-process = { path = "../../proto/process" }
