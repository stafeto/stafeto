name: setup
description: The system packages, the QEMU of the developers' Macs and rustup, as the jobs of ci need them.

inputs:
  qemu:
    description: Install QEMU (the release build runs no machine and leaves it out).
    default: "true"
  build-qemu:
    description: Build QEMU when the cache has none (otherwise a cache miss is an error).
    default: "false"

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        # The C probes need the clang of the developers' Macs (23): the
        # distribution's clang 18 lacks the __INT64_C family relibc's headers use.
        # nghttp2-client brings h2load, which step 4e of nginx-probe runs.
        sudo install -d -m 0755 /etc/apt/keyrings
        # A connection that a runner cannot make (run 43993748769: curl exit 7 to apt.llvm.org
        # after 195 ms) is tried again: five tries, three seconds apart, of 20 seconds each.
        retry="--retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20"
        curl -fsSL $retry -o "$RUNNER_TEMP/llvm.gpg.key" https://apt.llvm.org/llvm-snapshot.gpg.key
        sudo install -m 0644 "$RUNNER_TEMP/llvm.gpg.key" /etc/apt/keyrings/apt.llvm.org.asc
        echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/llvm.list
        # On 2026-11-11 the resolver of the runners failed for the Ubuntu mirror
        # while public resolvers answered. When that happens, the address from
        # a public resolver is pinned for this job.
        if ! getent hosts ports.ubuntu.com >/dev/null; then
          address=$(dig +short +time=3 +tries=2 ports.ubuntu.com @1.1.1.1 | grep -E '^[0-9.]+$' | head -1 || true)
          if [ -n "$address" ]; then
            echo "$address ports.ubuntu.com" | sudo tee -a /etc/hosts
          fi
        fi
        # A mirror that stops answering has to fail this step within minutes.
        # Left alone, apt retries until the time limit of the job and writes
        # gigabytes of warnings into the log.
        bounded="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
        sudo timeout 300 apt-get $bounded update
        sudo timeout 300 apt-get install $bounded -y --no-install-recommends \
          "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" make python3 git curl \
          ca-certificates bzip2 xz-utils patch gawk ninja-build pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev python3-venv flex bison \
          nghttp2-client
        echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
        "/usr/lib/llvm-$LLVM_VERSION/bin/clang" --version | head -1

    - name: Restore QEMU
      id: qemu
      if: inputs.qemu == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/qemu
        key: qemu-${{ runner.arch }}-${{ env.QEMU_VERSION }}-3
        fail-on-cache-miss: ${{ inputs.build-qemu != 'true' }}

    - name: Build QEMU
      if: inputs.qemu == 'true' && steps.qemu.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 "https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz" -o "$RUNNER_TEMP/qemu.tar.xz"
        mkdir "$RUNNER_TEMP/qemu-src"
        tar -xJf "$RUNNER_TEMP/qemu.tar.xz" -C "$RUNNER_TEMP/qemu-src" --strip-components=1
        cd "$RUNNER_TEMP/qemu-src"
        # The plugin API (include/qemu-plugin.h is installed with QEMU) is what
        # `cargo xtask wcet coverage` builds its trace plugin against. User-mode
        # networking (slirp) is what the network probes run on; without the
        # library the configure step fails at once.
        ./configure --prefix="$HOME/qemu" --target-list=aarch64-softmmu --disable-docs --disable-werror --disable-guest-agent --disable-user --enable-plugins --enable-slirp
        make -j"$(nproc)"
        make install

    - name: Put QEMU on PATH
      if: inputs.qemu == 'true'
      shell: bash
      run: |
        echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
        "$HOME/qemu/bin/qemu-system-aarch64" --version

    - name: Install rustup
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          # The script is downloaded whole (with tries) and then run: a cut download is never
          # run.
          script="$RUNNER_TEMP/rustup-init.sh"
          curl -sSf --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o "$script" https://sh.rustup.rs
          sh "$script" -y --profile minimal --default-toolchain none
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
