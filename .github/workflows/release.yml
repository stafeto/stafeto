name: release

# A tag `v<version>` builds the release files of that version, after the same
# groups as ci have passed on the tagged commit, and leaves draft releases for
# the owner to read and publish (docs/release.md). Four jobs keep the secrets
# away from the code that builds the packages:
#
#   ci     the groups of ci, called without secrets
#   build  carries the packages of the published index, builds the rest, the
#          images and the kernel; no secret, no environment
#   sign   a clean machine that builds nothing but xtask; holds the release
#          key alone, signs the packages again, the images and the index
#   draft  holds the token of stafeto/packages alone and creates the drafts
#
# `workflow_dispatch` from `main` is the dry run: the same jobs with the real
# key, no draft, the files only in the artifacts of the run for three days.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  LLVM_VERSION: "23"
  QEMU_VERSION: "11.1.2"

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      final: ${{ steps.version.outputs.final }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The version of the workspace, and that the tag names it
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "final=false" >> "$GITHUB_OUTPUT" ;; *) echo "final=true" >> "$GITHUB_OUTPUT" ;; esac
          if [ "$EVENT" = push ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

      - uses: ./.github/actions/setup
        with:
          qemu: "false"

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: release-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-${{ github.run_id }}
          restore-keys: |
            ci3-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-
            ci3-${{ runner.arch }}-

      - name: Source archives of the packages
        uses: actions/cache@v4
        with:
          path: target/dist-cache
          key: dist-cache-${{ hashFiles('packages/*.toml') }}

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Where the packages are carried from
        id: previous
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          series=$(echo "$VERSION" | cut -d. -f1,2)
          flag=$(python3 tools/pages.py previous --series "$series")
          echo "flag=$flag" >> "$GITHUB_OUTPUT"

      # The fingerprint of the ABI (a frozen series for a final version), the
      # packages carried from the index of the series and built otherwise, both
      # boot images, the kernel and the stage of tools/dist.py.
      - name: cargo xtask release-build
        run: cargo xtask release-build ${{ steps.previous.outputs.flag }}

      - name: Keep what the signing job needs
        uses: actions/upload-artifact@v4
        with:
          name: release-input
          path: target/release
          retention-days: 3
          if-no-files-found: error

  sign:
    name: sign
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: packages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: The pinned toolchain and xtask, before any key is on the machine
        run: |
          rustup toolchain install
          cargo build -p xtask

      - name: What the build job made
        uses: actions/download-artifact@v4
        with:
          name: release-input
          path: target/release

      - name: The release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "::error::the secret RELEASE_SIGNING_KEY of the environment packages is empty or missing"; exit 1; }
          # The certificate of the tree names the key; the secret holds that key.
          name=$(basename "$(ls keys/*.cert | sort | tail -1)" .cert)
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/keys/$name.key"
          echo "KEY=$RUNNER_TEMP/keys/$name.key" >> "$GITHUB_ENV"
          echo "CERT=keys/$name.cert" >> "$GITHUB_ENV"

      - name: Sign the packages, the images and the index
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          dir=target/release/pkg
          cargo xtask pkg-sign --key "$KEY" --cert "$CERT" --dir "$dir"
          cargo xtask image-repack target/release/boot-base.img --packages "$dir"
          cargo xtask image-repack target/release/boot-full.img --packages "$dir"
          serial=$(( $(cat target/release/previous-serial 2>/dev/null || echo 0) + 1 ))
          cargo xtask repo --from "$dir" --official --key "$KEY" --cert "$CERT" \
            --serial "$serial" --storage "v$VERSION-aarch64"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Check the signed repository with the roots of the tree
        run: cargo xtask repo --check --official --dir target/release/pkg

      - name: The archives
        run: cargo xtask release-pack

      - name: Keep the signed files
        uses: actions/upload-artifact@v4
        with:
          name: release-signed
          path: |
            target/dist
            target/release/pkg
          retention-days: 3
          if-no-files-found: error

  draft:
    name: draft
    needs: [build, sign]
    # The dry run (workflow_dispatch) leaves no draft.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: packages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The signed files
        uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: signed

      - name: Check the sums
        run: cd signed/dist && sha256sum --check SHA256SUMS

      - name: Notes of the release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          python3 tools/release-notes.py "$VERSION" "$GITHUB_REF_NAME" "$previous" > release-notes.md

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=--draft
          case "$VERSION" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "stafeto $VERSION" --notes-file release-notes.md \
            signed/dist/*

      - name: Draft of the storage release in stafeto/packages
        if: needs.build.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          test -n "$GH_TOKEN" || { echo "::error::the secret PACKAGES_TOKEN of the environment packages is empty or missing"; exit 1; }
          storage="v$VERSION-aarch64"
          if gh release view "$storage" --repo stafeto/packages >/dev/null 2>&1; then
            echo "::error::stafeto/packages has a release $storage already; the owner deletes the draft before a tag is set again"
            exit 1
          fi
          dir=signed/release/pkg
          # The new packages and their sources; a carried package is already in the storage it came from.
          files=$(python3 tools/pages.py new-files --dir "$dir")
          # shellcheck disable=SC2086
          gh release create "$storage" --draft --repo stafeto/packages \
            --title "stafeto $VERSION packages" \
            --notes "The packages built for stafeto $VERSION (series $(echo "$VERSION" | cut -d. -f1,2)), signed by the release key. Published by the workflow after the owner publishes the release v$VERSION of stafeto/stafeto." \
            $files
