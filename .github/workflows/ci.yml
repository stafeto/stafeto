name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same groups on the commit of a tag.
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Every test boots QEMU under TCG on the runner's cores.
  CI_JOBS: "2"
  LLVM_VERSION: "23"
  # The QEMU of the developers' Macs, built from source and cached: the same
  # machine models and timers on every host.
  QEMU_VERSION: "11.1.2"

# `build` builds once what the groups need and hands it over in a cache
# keyed by the run. Each group runs its part of `cargo xtask ci` (the list
# of the groups: `cargo xtask ci --list-groups`) in a job of its own, and
# every group runs to the end whatever the others do. `ci` is green when
# `build` and all the groups are.
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          build-qemu: "true"

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: ci3-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-${{ github.run_id }}
          restore-keys: |
            ci3-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-
            ci3-${{ runner.arch }}-

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: cargo xtask ci --group build
        run: cargo xtask ci --group build --jobs "$CI_JOBS"

      - name: Save the build for the groups
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: ci3-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-${{ github.run_id }}

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find target -type f \( -name '*.log' -o -name '*.out' -o -name '*.serial' -o -name 'config.log' \) -size -50M -print0 \
            | xargs -0 -r -I{} cp --parents {} ci-logs/ || true
          df -h > ci-logs/df.txt; free -m > ci-logs/free.txt; nproc > ci-logs/nproc.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-build
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  group:
    name: ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group:
          - host
          - kernel
          - os-test
          - open-posix-1
          - open-posix-2
          - open-posix-3
          - guests-1
          - guests-2
          - guests-3
          - net
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: ci3-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Install the pinned toolchain from the cache
        run: rustup toolchain install

      - name: Date the sources before the build
        # The build job compiled these very sources. Cargo takes a source
        # newer than its build for changed, and the checkout of this job is
        # newer than the build it restored.
        run: git ls-files -z | xargs -0 touch -d '2001-01-01 00:00:00'

      - name: cargo xtask ci --group ${{ matrix.group }}
        run: cargo xtask ci --group "${{ matrix.group }}" --jobs "$CI_JOBS"

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find target -type f \( -name '*.log' -o -name '*.out' -o -name '*.serial' -o -name 'config.log' \) -size -50M -print0 \
            | xargs -0 -r -I{} cp --parents {} ci-logs/ || true
          df -h > ci-logs/df.txt; free -m > ci-logs/free.txt; nproc > ci-logs/nproc.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.group }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  doom-probe:
    name: doom-probe
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: ci3-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Install the pinned toolchain from the cache
        run: rustup toolchain install

      - name: Date the sources before the build
        run: git ls-files -z | xargs -0 touch -d '2001-01-01 00:00:00'

      - name: cargo xtask doom-probe
        run: cargo xtask doom-probe

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find target -type f \( -name '*.log' -o -name '*.out' -o -name '*.serial' \) -size -50M -print0 \
            | xargs -0 -r -I{} cp --parents {} ci-logs/ || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-doom-probe
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  nginx-probe:
    name: nginx-probe
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: ci3-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-*.py') }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Install the pinned toolchain from the cache
        run: rustup toolchain install

      - name: Date the sources before the build
        run: git ls-files -z | xargs -0 touch -d '2001-01-01 00:00:00'

      - name: cargo xtask nginx-probe
        run: |
          rc=0
          for i in 1 2 3 4 5 6 7 8; do
            cargo xtask nginx-probe > run$i.log 2>&1 || { echo "run $i FAILED"; rc=1; }
            grep -a "DIAG\|posix-net: buffers\|after the reload\|start worker\|exited with\|^xtask\|reconfiguring" run$i.log | awk '/reconfiguring/{on=1} on' | head -300
          done
          exit $rc

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find target -type f \( -name '*.log' -o -name '*.out' -o -name '*.serial' \) -size -50M -print0 \
            | xargs -0 -r -I{} cp --parents {} ci-logs/ || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-nginx-probe
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: ci
    if: always()
    needs: [build, group, doom-probe, nginx-probe]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Every group is green
        run: |
          echo "build: ${{ needs.build.result }}, groups: ${{ needs.group.result }}, doom-probe: ${{ needs.doom-probe.result }}, nginx-probe: ${{ needs.nginx-probe.result }}"
          test "${{ needs.build.result }}" = success
          test "${{ needs.group.result }}" = success
          test "${{ needs.doom-probe.result }}" = success
          test "${{ needs.nginx-probe.result }}" = success
