name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Every test boots QEMU under TCG on the runner's cores.
  CI_JOBS: "2"
  LLVM_VERSION: "23"
  # The QEMU of the developers' Macs, built from source and cached: the same
  # machine models and timers on every host.
  QEMU_VERSION: "11.1.2"

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          # The C probes need the clang of the developers' Macs (23): the
          # distribution's clang 18 lacks the __INT64_C family relibc's headers use.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" make python3 git curl \
            ca-certificates bzip2 xz-utils patch ninja-build pkg-config libglib2.0-dev libpixman-1-dev python3-venv flex bison
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
          "/usr/lib/llvm-$LLVM_VERSION/bin/clang" --version | head -1

      - name: Restore QEMU
        id: qemu
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: qemu-${{ runner.arch }}-${{ env.QEMU_VERSION }}-1

      - name: Build QEMU
        if: steps.qemu.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz" -o "$RUNNER_TEMP/qemu.tar.xz"
          mkdir "$RUNNER_TEMP/qemu-src"
          tar -xJf "$RUNNER_TEMP/qemu.tar.xz" -C "$RUNNER_TEMP/qemu-src" --strip-components=1
          cd "$RUNNER_TEMP/qemu-src"
          ./configure --prefix="$HOME/qemu" --target-list=aarch64-softmmu --disable-docs --disable-werror --disable-guest-agent --disable-user
          make -j"$(nproc)"
          make install

      - name: Put QEMU on PATH
        run: |
          echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
          "$HOME/qemu/bin/qemu-system-aarch64" --version

      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install

      - name: Restore caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: ci2-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-relibc.py', 'tools/build-busybox.py', 'tools/build-ready-utils.py', 'tools/build-os-test.py', 'tools/build-open-posix.py') }}-${{ github.run_id }}
          restore-keys: |
            ci2-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-relibc.py', 'tools/build-busybox.py', 'tools/build-ready-utils.py', 'tools/build-os-test.py', 'tools/build-open-posix.py') }}-
            ci2-${{ runner.arch }}-

      - name: Install the pinned toolchain from the cache
        run: rustup toolchain install

      - name: cargo xtask ci
        run: cargo xtask ci --jobs "$CI_JOBS"

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: ci2-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/build-relibc.py', 'tools/build-busybox.py', 'tools/build-ready-utils.py', 'tools/build-os-test.py', 'tools/build-open-posix.py') }}-${{ github.run_id }}

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find target -type f \( -name '*.log' -o -name '*.out' -o -name '*.serial' -o -name 'config.log' \) -size -50M -print0 \
            | xargs -0 -r -I{} cp --parents {} ci-logs/ || true
          find target -maxdepth 3 -type f \( -name '*.stamp' -o -name 'manifest' \) -print0 | xargs -0 -r -I{} cp --parents {} ci-logs/ || true
          df -h > ci-logs/df.txt; free -m > ci-logs/free.txt; nproc > ci-logs/nproc.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14
