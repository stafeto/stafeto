[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
publish = false

# Deliberate breaks of the analysis of the kernel's time stamps (net_trace.rs), for the tests that
# must catch them: records of the kernel and of the programs not put in time order, and the exit
# from `wfi` counted in the flight of an SGI.
[features]
break-stamps-merge = []
break-stamps-split = []

[dependencies]
abi = { path = "../lib/abi" }
bootimg = { path = "../lib/bootimg", features = ["write"] }
# The records of the network service, whose quota `netd-quota` checks.
init = { path = "../services/init" }
# The ESP of the disk of the EFI loader (efi_disk.rs): FAT32 without the clock of
# the host, so that the disk is the same file every time.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1.1"
firmware-tree = { path = "../boot/firmware-tree" }
kcore = { path = "../kcore" }
netd = { path = "../services/netd" }
pkgd = { path = "../services/pkgd", features = ["host"] }
pkgfmt = { path = "../lib/pkgfmt", features = ["write"] }
proto-pkg = { path = "../proto/pkg", features = ["alloc"] }
proto-loader = { path = "../proto/loader" }
proto-net = { path = "../proto/net" }
rtc = { path = "../lib/rtc" }
virtio-pci = { path = "../lib/virtio-pci" }

[dev-dependencies]
entries = { path = "../lib/entries" }
proto-wire = { path = "../proto/wire" }
posix-fd = { path = "../lib/posix-fd" }
posix-types = { path = "../lib/posix-types" }
proto-fs = { path = "../proto/fs" }
