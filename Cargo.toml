[workspace]
resolver = "3"
members = ["apps/shell", "kcore", "proto/loader", "kernel", "lib/abi", "lib/bootimg", "lib/ext4ro", "lib/posix-abi", "lib/posix-crt", "lib/posix-platform", "lib/posix-fd", "lib/posix-heap", "lib/posix-map", "lib/posix-order", "lib/posix-types", "lib/posix-request", "lib/posix-time", "lib/posix-signals", "lib/posix-signal-queue", "lib/posix-sync", "lib/posix-thread", "lib/posix-fs", "lib/posix-path", "lib/rt", "proto/fs", "proto/init", "proto/uart", "proto/wire", "proto/clock", "proto/process", "lib/process-client", "lib/posix-credentials", "services/process", "services/init", "services/ramfs", "services/loader", "services/clock", "tests/clock-peer", "lib/posix-clock", "services/uart", "services/virtio-console", "tests/busybox", "tests/child", "tests/posix-abi", "tests/posix-procs", "tests/posix-tls", "tests/posix-threads", "tests/posix-shared", "tests/ext4ro", "tests/init", "tests/libc-ffi", "tests/os-test", "tests/os-test-run", "tests/ramfs", "tests/relibc-hello", "tests/relibc-threads", "tests/rtbench", "tests/rtbench-load", "tests/rtbench-posix", "tests/svc", "xtask"]
default-members = ["kcore", "lib/abi", "lib/bootimg", "lib/ext4ro", "lib/posix-path", "lib/posix-fd", "lib/posix-heap", "lib/posix-map", "lib/posix-order", "lib/posix-types", "lib/posix-request", "lib/posix-time", "lib/posix-signals", "lib/posix-signal-queue", "lib/posix-credentials", "proto/process", "proto/fs", "proto/init", "proto/uart", "proto/wire", "proto/clock", "proto/loader", "xtask"]

[workspace.package]
edition = "2024"
authors = ["Sergey Subbotin <ssubbotin@gmail.com>"]
repository = "https://github.com/stafeto/stafeto"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = true

# Spec 14: the kernel and kcore build at opt-level 2, the programs at "s".
# At "s" small copies go through calls to memcpy and memset and the short
# functions of the queues are not inlined, which costs the hot paths
# 15-41% of their instructions.
[profile.release.package.kernel]
opt-level = 2

[profile.release.package.kcore]
opt-level = 2

# Spec 5.4, 15.2: the programs of the test images build in the strict
# build of rt, release with debug assertions, where BAD_HANDLE from a
# typed call or a drop panics; the boot image that ships builds with
# --release.
[profile.checked]
inherits = "release"
debug-assertions = true

[profile.dev]
panic = "abort"
