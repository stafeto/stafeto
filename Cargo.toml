[workspace]
resolver = "3"
members = ["kcore", "kernel", "lib/abi", "lib/bootimg", "lib/rt", "proto/init", "proto/wire", "services/init", "tests/child", "tests/init", "xtask"]
default-members = ["kcore", "lib/abi", "lib/bootimg", "proto/init", "proto/wire", "xtask"]

[workspace.package]
edition = "2024"
authors = ["Sergey Subbotin <ssubbotin@gmail.com>"]
repository = "https://github.com/stafeto/stafeto"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = true

# Spec 14: the kernel and kcore build at opt-level 2, the programs at "s".
# At "s" small copies go through calls to memcpy and memset and the short
# functions of the queues are not inlined, which costs the hot paths
# 15-41% of their instructions.
[profile.release.package.kernel]
opt-level = 2

[profile.release.package.kcore]
opt-level = 2

# Spec 5.4, 15.2: the programs of the test images build in the strict
# build of rt, release with debug assertions, where BAD_HANDLE from a
# typed call or a drop panics; the boot image that ships builds with
# --release.
[profile.checked]
inherits = "release"
debug-assertions = true

[profile.dev]
panic = "abort"
