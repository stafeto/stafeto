default-members = ["kcore", "lib/abi", "lib/entries", "lib/rtc", "lib/bootimg", "lib/pkgfmt", "lib/dynlink", "lib/ext4ro", "lib/posix-path", "lib/posix-fd", "lib/posix-change", "lib/posix-heap", "lib/posix-map", "lib/posix-order", "lib/posix-types", "lib/posix-request", "lib/posix-time", "lib/posix-signals", "lib/posix-signal-queue", "lib/posix-credentials", "proto/process", "proto/fs", "proto/init", "proto/uart", "proto/wire", "proto/clock", "proto/pipe", "proto/loader", "xtask", "proto/tty", "lib/virtio-pci", "proto/entropy", "lib/posix-random", "lib/virtio-mmio", "lib/virtio-net", "lib/trace", "proto/gpu", "proto/net", "proto/input", "proto/blk", "proto/pkg"]
[workspace.package]
# The one place of the system's version: `uname`, the kernel crate and the release
# archives of `cargo xtask dist` take it from here.
version = "0.2.0"
edition = "2024"
authors = ["Sergey Subbotin <ssubbotin@gmail.com>"]
repository = "https://github.com/stafeto/stafeto"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = true

# Spec 14: the kernel and kcore build at opt-level 2, the programs at "s".
# At "s" small copies go through calls to memcpy and memset and the short
# functions of the queues are not inlined, which costs the hot paths
# 15-41% of their instructions.
[profile.release.package.kernel]
opt-level = 2

[profile.release.package.kcore]
opt-level = 2

# The network service and its stack build at opt-level 2 as well: smoltcp is
# many small functions, closures and chains of Option, which "s" does not
# inline (reports/2026-11-04-net-p1a). With full LTO the package of the
# program decides the last optimization, so `netd` is named too.
[profile.release.package.netd]
opt-level = 2

[profile.release.package.smoltcp]
opt-level = 2

# The driver of the network devices runs in netd's steps of every frame (the
# header, the checksums, the rings): the same level as the service.
[profile.release.package.virtio-net]
opt-level = 2

# Spec 5.4, 15.2: the programs of the test images build in the strict
# build of rt, release with debug assertions, where BAD_HANDLE from a
# typed call or a drop panics; the boot image that ships builds with
# --release.
[profile.checked]
inherits = "release"
debug-assertions = true

[profile.dev]
panic = "abort"

# The probe of processes copies its own ELF file into the RAM file service,
# whose files hold 8 MiB at most (and RLIMIT_FSIZE is 8 MiB): the layer, which
# every program carries, keeps the line tables of its code in its debug
# information, which leaves the room the probe needs.
[profile.release.package.posix-abi]
debug = "line-tables-only"
