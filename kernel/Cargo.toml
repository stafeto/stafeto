[package]
name = "kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The stafeto microkernel"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
abi = { path = "../lib/abi" }
bootimg = { path = "../lib/bootimg" }
kcore = { path = "../kcore" }

[features]
ktest = []
# The kernel tests with those that need `-icount` added (ktest::el0).
icount = ["ktest", "measure"]
# The second image of the kernel tests: the EL0 tests alone (ktest::EL0_HALF).
el0-half = ["ktest"]
fault-probe = []
overflow-probe = []
# The kernel acts as if PSCI refused CPU_ON for the third CPU (xtask smp-cpu-on).
cpu-on-refused = []
# The kernel widens the window between the section that posts a command and
# its flush, and holds the end of a thread of a process that is killed until
# the reply to it is on its way, and holds a CPU back from a quiescent point
# for 20 ms (xtask smp-window).
window-probe = ["kcore/ready-gap"]
# The wait inside the removal from a ready queue for the threads of every
# level (xtask posix-procs with STAFETO_READY_GAP set).
ready-gap = ["kcore/ready-gap-all"]
# The probe kernel with one deliberate break each (xtask smp-window): no look
# at the request of the entry under OBJ before a receive or a send waits, and
# a receive that gives OBJ back between its look at the head of a queue and
# the take of the request, which the number of the section must catch.
break-block-check = ["window-probe"]
break-one-section = ["window-probe"]
# No second look at the life of the process after the portion of a mem_map RX
# gave OBJ back for the instruction cache.
break-alive-check = ["window-probe"]
# No second look at x3 and x5 of process_create after the gap between its sections.
break-spawn-check = ["window-probe"]
measure = []
# The checks of OBJ (obj.rs) in an image that runs the test init on several
# CPUs: the places that change a link outside a section stop the kernel
# (xtask smp-probe).
obj-checks = []
# The counters of SMP stage 6: kernel time and waits for OBJ of each CPU, printed on
# request of the program (xtask smp-measure).
smp-measure = ["measure"]
# The ASID is 4 bits wide, so that a new generation begins every dozen switches of
# address space (xtask smp-asid).
asid-probe = ["kcore/narrow-asid"]
# 3 bits for the boot of the shell under VZ, which has few processes (xtask
# smp-asid-vz).
asid-probe-3 = ["asid-probe"]
# The probe kernel with one deliberate break each (xtask smp-asid): no reserved
# ASIDs, no deferred flush, no aside1is at the end of a process, an ASID
# that goes before the other CPUs left the tables, and a TLBI of an
# unmapped page that stays on its own CPU.
break-asid-reserved = ["asid-probe", "kcore/break-reserved"]
break-asid-flush = ["asid-probe", "kcore/break-flush"]
break-asid-aside = ["asid-probe", "kcore/break-aside"]
break-asid-retire = ["asid-probe"]
break-unmap-local = []
# The CPUs poll in the idle loop everywhere (idle-poll), or nowhere
# (no-idle-poll); with neither, where kcore::idlepoll::enabled says (the MIDR
# of a guest of Apple's hypervisor).
idle-poll = []
no-idle-poll = []
# The poll with a window of 1 ms and the line xtask looks for when a window
# ends with an interrupt pending (xtask smp-idle-bell).
idle-probe = ["idle-poll"]
# The probe kernel with one deliberate break each: the sender reads POLLING
# and writes BELL in two steps with a wait between them, the bell ends the poll
# with no drain of the queues, and the poll does not read ISR_EL1.
break-idle-bell = ["idle-probe", "window-probe"]
break-idle-drain = ["idle-probe", "window-probe"]
break-idle-irq = ["idle-probe", "window-probe"]
atomic-locks = ["kcore/atomic-locks"]
locked-decide = []
baseline = ["ktest", "atomic-locks", "locked-decide"]
trace = []
trace-test = ["ktest", "trace"]
