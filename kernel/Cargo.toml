[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The stafeto microkernel"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
abi = { path = "../lib/abi" }
bootimg = { path = "../lib/bootimg" }
kcore = { path = "../kcore" }

[features]
ktest = []
# The kernel tests with those that need `-icount` added (ktest::el0).
icount = ["ktest", "measure"]
# The second image of the kernel tests: the EL0 tests alone (ktest::EL0_HALF).
el0-half = ["ktest"]
fault-probe = []
overflow-probe = []
# The kernel acts as if PSCI refused CPU_ON for the third CPU (xtask smp-cpu-on).
cpu-on-refused = []
# The kernel widens the window between the section that posts a command and
# its flush, and holds the end of a thread of a process that is killed until
# the reply to it is on its way, and holds a CPU back from a quiescent point
# for 20 ms (xtask smp-window).
window-probe = []
measure = []
# The ASID is 4 bits wide, so that a new generation begins every dozen switches of
# address space (xtask smp-asid).
asid-probe = ["kcore/narrow-asid"]
# 3 bits for the boot of the shell under VZ, which has few processes (xtask
# smp-asid-vz).
asid-probe-3 = ["asid-probe"]
# The probe kernel with one deliberate break each (xtask smp-asid): no reserved
# ASIDs, no deferred flush, no aside1is at the end of a process, and a TLBI
# of an unmapped page that stays on its own CPU.
break-asid-reserved = ["asid-probe", "kcore/break-reserved"]
break-asid-flush = ["asid-probe", "kcore/break-flush"]
break-asid-aside = ["asid-probe", "kcore/break-aside"]
break-unmap-local = []
atomic-locks = ["kcore/atomic-locks"]
locked-decide = []
baseline = ["ktest", "atomic-locks", "locked-decide"]
trace = []
trace-test = ["ktest", "trace"]
