#
# Dropbear SSH server (the server only, with its own copies of LibTomCrypt
# and LibTomMath): public-key login to the system.
# Format: docs/packages.md.

name = "dropbear"
version = "2026.94"
kind = "optional"
image = "net"
release = "1"
summary = "Dropbear SSH server"
url = "https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2"
sha256 = "e098034a843699200c8c977a991fff73159735bf795d5f72ef672c41a6b1ae81"
license = "MIT AND BSD-2-Clause"
license_file = "LICENSE"
needs = ["net"]
build = "tools/build-dropbear.py"
program = "dropbear"
# The host key is made at boot by /etc/rc.d/dropbear (`dropbearkey`): the
# directory is empty in every image.
dirs = ["/etc/dropbear"]
files = [
  "/bin/dropbear = elf:dropbear",
  # The same program under the name that makes the host key.
  "/bin/dropbearkey = link:dropbear",
  # The shells an account may have: the server refuses a login whose shell is not listed.
  "/etc/shells = bytes:shells",
]
