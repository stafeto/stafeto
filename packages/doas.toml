#
# OpenDoas: runs a command as another user by the rules of /etc/doas.conf. It
# is built with no PAM, no shadow authentication and no timestamps, so only a
# rule with `nopass` lets anyone in. Set-user-ID root in the image.
# Format: docs/packages.md.

