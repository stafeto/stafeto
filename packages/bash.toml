name = "bash"
version = "5.3"
kind = "addon"
url = "https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz"
sha256 = "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"
license = "GPL-3.0-or-later"
depends = ["busybox"]
build = "tools/build-bash.py"
program = "bash"
files = [
  "/bin/bash = elf:bash",
  # The keys of the line editor (readline reads /etc/inputrc).
  "/etc/inputrc = bytes:inputrc",
]
