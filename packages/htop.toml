# htop.
# Format: docs/packages.md.

name = "htop"
version = "3.5.3"
kind = "optional"
image = "shell"
release = "1"
summary = "htop process viewer"
url = "https://github.com/htop-dev/htop/releases/download/3.5.3/htop-3.5.3.tar.xz"
sha256 = "a8b164386494cb85bb255a415a3f5f80afe7a0c4491da5d113b3a0f951087e65"
license = "GPL-2.0-or-later"
depends = ["ncurses"]
build_depends = ["ncurses"]
build = "tools/build-htop.py"
program = "htop"
dirs = ["/usr/local", "/usr/local/etc"]
files = [
  "/bin/htop = elf:htop",
  # The settings htop reads when the home has none (SYSCONFDIR): no row for
  # the threads of a process, whose numbers /proc/<pid>/task makes from the
  # PID and may meet the PID of another process.
  "/usr/local/etc/htoprc = bytes:htoprc",
]
