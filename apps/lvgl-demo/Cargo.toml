[package]
name = "lvgl-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The LVGL demo of stafeto: widgets with FreeType text in a window of the composition service, a statically linked C program on relibc"
build = "build.rs"

[[bin]]
name = "lvgl-demo"
test = false
bench = false

[dependencies]
posix-abi = { path = "../../lib/posix-abi", features = ["thread-probe"] }
posix-crt = { path = "../../lib/posix-crt", features = ["window"] }
