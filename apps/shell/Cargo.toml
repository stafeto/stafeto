[package]
name = "shell"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "The shell of stafeto"

# What the shell decides, apart from the calls it makes: tested on the
# host.
[lib]
bench = false

[[bin]]
name = "shell"
test = false
bench = false

# `log-burst`: the command `logburst`, which writes LOG_BURST lines into the
# kernel log, a few at a time, for the probes of the console's drivers (xtask
# console-dialog, console-restart-vz). On in `boot.img` and in the image of
# console-restart-vz only; the release images (boot-base.img, boot-full.img,
# boot-aws.img) hold a shell without it (an xtask test checks that).
[features]
log-burst = []

[dependencies]
abi = { path = "../../lib/abi" }
proto-init = { path = "../../proto/init" }
proto-uart = { path = "../../proto/uart" }
proto-wire = { path = "../../proto/wire" }

# The program alone runs on stafeto: the host tests of the library build
# without rt.
[target.'cfg(target_os = "none")'.dependencies]
rt = { path = "../../lib/rt" }
