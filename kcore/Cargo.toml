[package]
name = "kcore"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "Hardware-independent kernel logic of stafeto, tested on the host"

[lib]
bench = false

[dependencies]
abi = { path = "../lib/abi" }

[features]
atomic-locks = []
# ASIDs 4 bits wide, for the probe build of the kernel (feature asid-probe).
narrow-asid = []
# Deliberate breaks of the ASID scheme, for the probes that must catch them
# (xtask smp-asid): a new generation reserves no number a CPU runs, leaves
# no flush to the CPUs, and a process that goes does not drop its ASID.
break-reserved = []
break-flush = []
break-aside = []
