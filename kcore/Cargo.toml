[package]
name = "kcore"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "Hardware-independent kernel logic of stafeto, tested on the host"

[lib]
bench = false

[dependencies]
abi = { path = "../lib/abi" }

[features]
atomic-locks = []
# ASIDs 4 bits wide, for the probe build of the kernel (feature asid-probe).
narrow-asid = []
