[package]
name = "kcore"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
description = "Hardware-independent kernel logic of stafeto, tested on the host"

[lib]
bench = false

[dependencies]
abi = { path = "../lib/abi" }

[features]
# The writer of device trees (fdt::Builder), for the boot loader, which needs
# `alloc`; the kernel leaves it off.
builder = []
atomic-locks = []
# ASIDs 4 bits wide, for the probe build of the kernel (feature asid-probe).
narrow-asid = []
# A wait inside the removal of an item from a ready queue, between the steps
# of the link (feature window-probe of the kernel).
ready-gap = []
# The same wait for items of every level.
ready-gap-all = ["ready-gap"]
# Deliberate breaks of the ASID scheme, for the probes that must catch them
# (xtask smp-asid): a new generation reserves no number a CPU runs, leaves
# no flush to the CPUs, and a process that goes does not drop its ASID.
break-reserved = []
break-flush = []
break-aside = []
# Deliberate breaks of the ring of time stamps, for the host tests that must
# catch them: a read that does not skip the records a wrapped ring wrote
# over, and a portion whose cursor jumps a record.
break-stamps-wrap = []
break-stamps-portion = []
# Deliberate breaks of the ITS command counter and the portions of teardown, for
# the host tests that must catch them (xtask its-breaks): a counter of 32 bits, a
# target compared by its place on the ring, a sender outside `OBJ` that takes the
# slots a section reserved, a wait that sends its commands again at each step, and
# a wait that takes the commands for run once they are sent, and a stall clock
# that ignores the advances of the ITS.
break-its-counter-32 = []
break-its-ring-position = []
break-its-keep = []
break-its-step-resend = []
break-its-step-early = []
break-its-stall-clock = []
# Deliberate breaks of the tables and registers of the ITS (xtask its-breaks):
# the command queue and the property table back on 4 KiB and 8 KiB blocks, a
# GITS_BASER read-back that leaves the address out, and a line `its tables`
# that shows virtual addresses.
break-its-align-4k = []
break-its-readback-mask = []
break-its-print-pa = []
# A wait for Register Write Pending that timed out is taken as done.
break-its-rwp-ignore = []
# Deliberate breaks of the time budget, for the host tests and the probe that
# must catch them (xtask budget-breaks): a replenishment that never applies, a
# period that comes back too soon, chunks that merge whatever their times, an
# overrun that is not charged, an exhausted thread that keeps its level, a
# boost by a notification slot that survives the exhaustion, and a thread with
# no budget that ignores the level its process allows.
break-budget-refill = []
break-budget-short-period = []
break-budget-merge-always = []
break-budget-no-overrun = []
break-budget-keep-level = []
break-budget-keep-slot = []
break-budget-no-free = []
