; The settings of F-Stack on stafeto (ff_load_config). The [dpdk] section
; keeps its form only: the host layer of stafeto has no DPDK and reads none
; of it. No port is listed: the stack has its loopback interface alone (a
; port of the network service's device takes its address from the service,
; with no [port0] section).
[dpdk]
lcore_mask=1
idle_sleep=0
pkt_tx_delay=0
promiscuous=0
tso=0

[freebsd.boot]
hz=100
fd_reserve=0
; memsz_MB sizes the page array of ff_memory.c, which this build leaves
; out: the stack takes its memory from mmap as it goes.
memsz_MB=256

[freebsd.sysctl]
kern.ipc.somaxconn=4096
; The stack's socket numbers stay below 262 144, the range of the fast
; sockets of the POSIX layer (FAST_MAX).
kern.maxfilesperproc=262144
net.inet.tcp.sendspace=16384
net.inet.tcp.recvspace=8192
net.inet.tcp.sendbuf_auto=1
net.inet.tcp.recvbuf_auto=1
net.inet.tcp.sendbuf_max=16777216
net.inet.tcp.recvbuf_max=16777216
net.inet.tcp.cc.algorithm=cubic
net.inet.tcp.sack.enable=1
net.inet.tcp.rfc1323=1
net.inet.tcp.delayed_ack=1
net.inet.tcp.msl=2000
; Segments for a port with no socket get no RST: the switch counts every
; frame it refuses, and an answer to a stray segment would count as one.
net.inet.tcp.blackhole=2
net.inet.tcp.fast_finwait2_recycle=1
net.inet.tcp.finwait2_timeout=5000
net.inet.ip.portrange.randomized=1
net.inet.udp.blackhole=1
; A burst of connections can reach a stack that has not yet learned the
; address of its gateway: the first answer asks for it, and the rest wait for
; the reply in the entry's hold queue, which keeps 16 packets in this tree
; (arp_maxhold in if_ether.c; the stock config.ini of F-Stack sets 5) and drops
; the others, so 500 SYN-ACKs do not fit (the peer sends its SYN again a
; second later). Room for the burst of a full listen queue.
net.link.ether.inet.maxhold=1024
; A segment from the shared address comes in through the ring when a program of
; the guest talks to this stack (the switch turns the frame back): FreeBSD drops
; frames that pretend to be ours unless this is 0.
net.inet.ip.source_address_validation=0
